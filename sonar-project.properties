# SonarQube, for the classes of finding golangci-lint does not carry.
#
# The Go linter set already covers correctness and security here, and it gates
# every pull request through tools/lint-ratchet.sh. Sonar earns its keep on the
# things that are not a single-file rule: cognitive complexity per function,
# duplication measured across the whole tree rather than by a threshold, and a
# coverage number that can be looked at per package instead of as one figure.
#
# It runs on demand, not in CI. A second gate that has to be satisfied before a
# merge is a second thing to work around; this one is for reading.
#
#   docker run --rm --network host \
#     -v "$PWD:/usr/src" -e SONAR_TOKEN=... sonarsource/sonar-scanner-cli
#
# Coverage comes from `go test ./... -coverprofile=coverage.out`, which is not
# generated by the scan - a scanner that runs the suite is a scanner nobody
# waits for.

sonar.projectKey=meshbench
sonar.projectName=MeshBench
sonar.sources=.
sonar.host.url=http://localhost:9000

# Tests declared separately so their complexity and duplication do not count
# against the code they test. A table-driven test is repetitive on purpose.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.exclusions=\
  **/vendor/**,\
  **/testdata/**,\
  docs/**,\
  packaging/**,\
  internal/ui/workbench/licences/licences.go

# Generated: licgen writes this from the build graph, so a finding in it is a
# finding about licgen and belongs at licgen.
sonar.coverage.exclusions=\
  **/*_test.go,\
  cmd/gallery/**,\
  tools/mockup/**,\
  tools/render/**

sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8
