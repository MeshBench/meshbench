name: publish tap

# The Homebrew casks, rewritten to point at the release that just published.
#
# `brew install --cask meshbench` is the macOS half of the apt repository, and
# it fixes something a disk image cannot fix on its own: we are not notarised,
# so a first launch is otherwise refused until the user right-clicks and chooses
# Open. Homebrew removes the quarantine attribute itself.
#
# A maintainer sets up two things once:
#
#   1. The tap repository, MeshBench/homebrew-meshbench. Homebrew requires that
#      name: `brew tap MeshBench/meshbench` looks for homebrew-meshbench. It
#      needs no contents to begin with; this workflow writes the two casks.
#   2. A fine-grained token with Contents: read and write on that repository,
#      as TAP_PUBLISH_TOKEN.
#
# Two casks, and the plain name is the application on its own, matching apt. A
# cask re-fetches the whole disk image on every upgrade, so the default that is
# right for a one-off download is the wrong one to repeat every release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for a re-run'
        required: true
      dry_run:
        description: 'Render the casks and push nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  publish:
    name: rewrite the casks
    runs-on: ubuntu-latest
    environment: tap-publish
    steps:
      - name: What this release published
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # The digests come from the release's own SHA256SUMS rather than being
          # recomputed here: that file is what the download page tells people to
          # check against, so a cask disagreeing with it would be two answers to
          # one question.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'SHA256SUMS' --dir .
          cat SHA256SUMS
          for v in bundled compact; do
            name="MeshBench-arm64-$v.dmg"
            sum=$(awk -v n="$name" '$2 == n || $2 == "*"n {print $1}' SHA256SUMS | head -1)
            [ -n "$sum" ] || { echo "::error::$TAG published no $name"; exit 1; }
            echo "sha_$v=$sum" >> "$GITHUB_OUTPUT"
          done

      - name: Render them
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          SHA_BUNDLED: ${{ steps.rel.outputs.sha_bundled }}
          SHA_COMPACT: ${{ steps.rel.outputs.sha_compact }}
        run: |
          set -euo pipefail
          mkdir -p out/Casks
          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"

          # The zap stanza is not decoration. MeshBench caches terrain, board
          # images and firmware under ~/.cache and ~/Library, and an uninstall
          # that leaves a few hundred megabytes behind is one people find out
          # about later.
          write_cask() {
            token=$1; variant=$2; sha=$3; desc=$4
            cat > "out/Casks/${token}.rb" <<CASK
          cask "${token}" do
            version "${VERSION}"
            sha256 "${sha}"

            url "${base}/MeshBench-arm64-${variant}.dmg",
                verified: "github.com/${GITHUB_REPOSITORY}/"
            name "MeshBench"
            desc "${desc}"
            homepage "https://meshbench.github.io/"

            depends_on macos: ">= :monterey"
            depends_on arch: :arm64

            app "MeshBench.app"

            zap trash: [
              "~/Library/Application Support/meshbench",
              "~/Library/Caches/meshbench",
              "~/Library/Preferences/io.github.meshbench.meshbench.plist",
              "~/Library/Saved Application State/io.github.meshbench.meshbench.savedState",
            ]
          end
          CASK
          }

          write_cask meshbench compact "$SHA_COMPACT" \
            "RF-accurate MeshCore simulator, the application on its own"
          write_cask meshbench-bundled bundled "$SHA_BUNDLED" \
            "RF-accurate MeshCore simulator, with the QEMU and Renode emulators"

          cat > out/README.md <<'README'
          # MeshBench's Homebrew tap

          Generated by `.github/workflows/publish-tap.yml` in
          [MeshBench/meshbench](https://github.com/MeshBench/meshbench). An edit
          made here is overwritten by the next release.

          ```
          brew tap MeshBench/meshbench
          brew install --cask meshbench
          ```

          `meshbench` is the application on its own, about 26 MB. Emulated boards
          work once Configuration > Setup fetches the emulators.

          `meshbench-bundled` carries QEMU and Renode with it, about 118 MB, and
          an emulated board boots on first run.

          The plain name is the smaller one because a package manager
          re-downloads on every release, for a tool you may never point at an
          emulated board. A one-off download is a different question, and
          [the download page](https://meshbench.github.io/download/) leads with
          the bundled build there.
          README

          sed -i 's/^          //' out/Casks/*.rb out/README.md
          echo "--- meshbench.rb"; cat out/Casks/meshbench.rb

      - name: Publish
        env:
          TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::TAP_PUBLISH_TOKEN is not set on the tap-publish"\
                 "environment; see the header of this file. Failing rather than"\
                 "skipping: a tap that quietly stops being updated goes on"\
                 "installing an old version and says nothing"
            exit 1
          fi
          git clone --quiet \
            "https://x-access-token:$TOKEN@github.com/MeshBench/homebrew-meshbench.git" tap \
            || { echo "::error::MeshBench/homebrew-meshbench does not exist yet."\
                      "Homebrew requires that exact name: brew tap"\
                      "MeshBench/meshbench looks for homebrew-meshbench"; exit 1; }
          mkdir -p tap/Casks
          cp out/Casks/*.rb tap/Casks/
          cp out/README.md tap/
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "the casks are unchanged"
            exit 0
          fi
          git commit -q -m "meshbench $TAG"
          if [ "$DRY" = "true" ]; then
            echo "dry run; the commit was made and not pushed:"
            git show --stat HEAD
            exit 0
          fi
          git push
          echo "published"
