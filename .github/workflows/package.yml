name: package

# A bundle somebody can download and run, with the emulators inside it.
#
# All three platforms. The mac and windows inputs exist so a dispatched test
# build can skip the slower macOS leg, not to decide what a release
# contains: a tag push carries no inputs and builds everything.
#
# The plan this implements is docs/release-packaging-plan.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.0.1 (blank builds without releasing)'
        type: string
        default: ''
      release:
        description: 'Publish a release from this build'
        type: boolean
        default: false
      mac:
        description: 'Build the macOS dmg (runs on the self-hosted M4 - leave off for a quicker test build)'
        type: boolean
        default: true
      windows:
        description: 'Build the Windows zip (cross-compiled on Linux, so it needs no Windows runner)'
        type: boolean
        default: true

# The CARTO basemap key is a repository secret, stamped into release
# binaries at link time (see internal/world/basemap.defaultCartoKey) so a
# downloaded build serves keyed tiles out of the box. It never appears in
# the source tree, and the operator's environment overrides it at runtime.
env:
  CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}

jobs:
  linux:
    timeout-minutes: 75
    # The oldest base that can link. This used to be 24.04 because cimgui-go
    # shipped a prebuilt cimgui.a referencing __isoc23_sscanf, a symbol glibc
    # only grew in 2.38 - a dependency's floor showing through as several
    # hundred undefined references. workbench1 and internal/ui are gone, so
    # nothing links cimgui and the floor is now the runner's own glibc: 2.35,
    # which reaches Ubuntu 22.04 and Debian 12.
    #
    # Not RHEL 9, which this comment used to claim: it ships 2.34, one release
    # below the floor, so the binary will not start there. Reaching it means
    # building on an older base than this runner, which is a decision about
    # what the release supports rather than a correction to make in passing.
    #
    # Build on the oldest base you intend to support, because glibc symbol
    # versioning is one-way: a binary linked against 2.35 runs on 2.38, and
    # never the other way round.
    # lab-2204 is the one Ubuntu 22.04 runner in the pool, and that is the
    # whole point of the label - it pins the glibc floor described above. Do
    # not widen this to lab-linux; the other two are 24.04 and would raise it.
    #
    # No fork guard here: this workflow only triggers on tag pushes and
    # workflow_dispatch, both of which need write access to this repo.
    runs-on: [self-hosted, linux, x64, lab-2204]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # 1.25, matching go.mod and ci.yml. Not cosmetic: the lab runners
        # set GOTOOLCHAIN=local, so Go may not fetch the toolchain go.mod
        # asks for - and every go command in this job died on
        # "go.mod requires go >= 1.25.0 (running go 1.24.13)".
        #
        # cache: false - every job in this file runs on a persistent
        # self-hosted runner (lab-2204, or the m4 pool), where the Go
        # caches already survive between jobs. See ci.yml for the detail.
        with: { go-version: '1.25', cache: false }

      # Checked before anything is built, because a missing tool used to
      # surface eight steps later as "no radioserver-v1 release" - naming a
      # release that exists. That was gh, which is not part of a bare Ubuntu
      # image; the fetches use curl now, which is here and was already used
      # for the emoji font.
      - name: The tools this job shells out to
        run: |
          missing=""
          for t in curl tar; do command -v "$t" >/dev/null || missing="$missing $t"; done
          if [ -n "$missing" ]; then
            echo "::error::this runner is missing:$missing - install them on the runner;"\
                 "every release artefact below is fetched with curl"
            exit 1
          fi
          curl --version | head -1

      - name: Dependencies
        run: |
          sudo apt-get update
          # cgo through Gio and wgpu, so this is a native build and not a
          # cross-compile. GL, X11, Wayland, xkbcommon, EGL and Vulkan headers
          # are all needed to link even though the binary can run headless.
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libffi-dev

      - name: Licences are fresh
        # The window shows what the binary links. Regenerate and diff: a new
        # dependency without a licence entry fails here, not in a lawyer's
        # inbox. licgen itself fails on a module whose licence it cannot name.
        run: |
          go run ./tools/licgen
          git diff --exit-code -- internal/ui/workbench/licences/licences.json

      - name: Build and check
        run: |
          set -e
          test -z "$(gofmt -l ./cmd ./internal ./tools)"
          go vet ./...
          # -short: the long tests boot real firmware and measure run-to-run
          # spread, which needs an idle machine - a shared runner fails the
          # noise-floor measurement on load, not on code. The full suite is
          # ci.yml's job; this gate is that the artifact builds and works.
          go test -short ./...
          # One binary, one workbench: `meshbench workbench` is the Gio app,
          # and the imgui one it replaced has been deleted.
          #
          # The app ID is set here rather than left to default. Gio takes the
          # Wayland app_id and the X11 class from it, and the default is the
          # binary's own name - so a taskbar grouping and a window-manager rule
          # would otherwise key on whatever the file happened to be called.
          #
          # Reverse DNS wants a domain the project controls, and MeshBench owns
          # no domain - so it takes the form for a GitHub-hosted project, which
          # is what Flathub asks for too. It follows the org, not a person.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          # A release is a plain X.Y.Z everywhere it is spelled, and the
          # control socket's pairing rule reads exactly that: a workbench
          # stamped vv0.1.0 is not a release at all as far as it can tell, and
          # pairs happily with every client of every version. publish-clients
          # already refuses anything else, so half a release would publish.
          case "$VERSION" in *-dev-*) ;; *)
            echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' ||
              { echo "::error::version '$VERSION' is not a plain X.Y.Z"; exit 1; } ;;
          esac
          go build -trimpath \
            -ldflags "-X gioui.org/app.ID=io.github.meshbench.meshbench \
              -X github.com/MeshBench/meshbench/internal/world/basemap.defaultCartoKey=${CARTO_API_KEY} \
                      -X github.com/MeshBench/meshbench/internal/app/version.Version=v$VERSION" \
            -o dist/meshbench/meshbench ./cmd/meshbench

      - name: Fetch the emulators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Both are our forks and neither can be a distribution build: ours
          # carry the SX1262 device and the SEVONPEND fix respectively, and a
          # stock build of either runs, reports no chip or hangs, and looks like
          # our fault. The changes are deliberately not upstreamed, so the
          # forks' own release artifacts carry a meshbench mark in the name -
          # nobody should mistake one for an upstream build.
          #
          # By tag, never by /latest: the tag and the exact asset name are in
          # packaging/emulator-pins.env, which the runtime fetcher's catalogue
          # is checked against, so a CI bundle and a first-run download are the
          # same emulator and a fork release re-cut by somebody else cannot
          # change either without a commit here.
          . packaging/emulator-pins.env
          packaging/fetch-emulator.sh MeshBench/qemu "$QEMU_RELEASE" \
            "$QEMU_ASSET_LINUX_AMD64" QEMU dist/meshbench
          packaging/fetch-emulator.sh MeshBench/renode "$RENODE_RELEASE" \
            "$RENODE_ASSET_LINUX_AMD64" Renode dist/meshbench
          cd dist/meshbench
          # -xf rather than -xzf: the two forks package differently and the
          # bundle should not care which. tar reads the compression itself.
          for f in *.tar.gz *.tar.xz; do [ -e "$f" ] || continue; tar xf "$f" && rm "$f"; done
          ls -la

      - name: The radio model
        # Every emulated node looks this up *before* either emulator, so a
        # bundle without it ships a QEMU and a Renode that nothing can drive.
        # 0.0.1 through 0.0.3 shipped exactly that: two emulators, no radio,
        # and a README claiming emulated boards worked.
        #
        # Fetched as a release asset, the same as the emulators, and pinned in
        # the same file: built once and published, not rebuilt from source in
        # every job that needs it. Fatal rather than a warning, for the same
        # reason the Mac's emulator fetch is: a bundle that cannot emulate is a
        # broken artifact, and the way this stayed hidden was a green build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # No || here. It used to swallow the downloader's own error and
          # report "no radioserver release", which was wrong - the release
          # existed and gh was not installed - and sent the reader to the wrong
          # repository. set -e stops the job; the script says why.
          . packaging/emulator-pins.env
          tools/fetch-release-asset.sh MeshBench/meshcore-native "$RADIOSERVER_RELEASE" \
            "/$RADIOSERVER_ASSET_LINUX_AMD64\$" dist/meshbench
          mv "dist/meshbench/$RADIOSERVER_ASSET_LINUX_AMD64" dist/meshbench/radioserver
          chmod +x dist/meshbench/radioserver
          dist/meshbench/radioserver 2>&1 | head -1 || true

      - name: Fonts and fixtures
        run: |
          set -e
          # Emoji in node names should not depend on the user's font packages;
          # withEmoji() looks in fonts/ beside the binary first. OFL-1.1, and
          # the licence window carries the attribution.
          mkdir -p dist/meshbench/fonts
          curl -fsSL -o dist/meshbench/fonts/NotoColorEmoji.ttf \
            https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf \
            || echo "::warning::emoji font not fetched, bundle falls back to system fonts"
          # The shipped fixtures, so the workbench has something to open on a
          # machine with nothing else on it.
          cp -r fixtures dist/meshbench/fixtures

      - name: Assemble
        run: |
          set -e
          cd dist/meshbench
          # The same inventory the Help > Licences window shows, as files, for
          # the people who read a directory rather than open a window.
          (cd ../.. && go run ./tools/licgen -text dist/meshbench/LICENCES)
          # Beside the binary is where MeshBench looks second, after the
          # environment variable and before its cache. A desktop application is
          # not launched from a shell, so PATH is nearly useless to it.
          # Both emulators unpack into their own directory, and MeshBench
          # looks for an executable *file* beside its own binary - so each
          # needs a symlink or the bundle contains an emulator nobody can
          # find. Renode's directory carries its version, so match on the
          # shape rather than a name that changes with every release.
          for d in qemu qemu-meshbench; do
            [ -d "$d" ] && ln -sf "$d/bin/qemu-system-xtensa" . && break
          done
          for d in renode_*-portable renode-*-portable renode; do
            [ -x "$d/renode" ] && ln -sf "$d/renode" . && break
          done
          # What the bundle actually contains, asked the way a node asks. A
          # missing emulator is a broken artifact and stops the job here, one
          # step before it would be tarred up and published.
          ../../packaging/verify-bundle.sh . linux-amd64
          cat > README.txt <<'TXT'
          MeshBench

          Run ./meshbench workbench

          Needs a GPU with Vulkan or GL.

          MeshBench is free software under the GNU General Public Licence,
          version 3 or later. The full terms are in LICENCES/, and the source
          for this exact build is the meshbench-*-source.tar.gz published beside
          it on the release page.

          The emulators beside this file are found automatically. They are not
          distribution builds and cannot be: the QEMU carries an SX1262 device
          upstream does not have, and the Renode carries a SEVONPEND fix without
          which published nRF52 firmware sleeps for ever. Their release
          artifacts say meshbench in the name for that reason - these forks are
          built for this simulator and are not upstream releases.

          qemu-system-xtensa is a symlink on purpose. QEMU resolves its own path
          to find its data files, so a bare copy of the binary will not run.

          radioserver is the SX1262 model the emulated firmware clocks over a
          socket. It is the same chip object a native node uses in process, so
          an emulated node and a native one are the same radio. Both emulators
          need it; neither works without it.

          Native MeshCore builds and board images are downloaded on first use and
          cached under ~/.cache/meshbench. Nothing else is needed.

          Needs glibc 2.35 or newer: Ubuntu 22.04, Debian 12, or anything
          more recent. RHEL 9 ships 2.34 and is below the floor.

          Everything this bundle ships under is in LICENCES/, and in the
          application under Help > Licences & attributions.
          TXT
          cd ..
          # MeshCIM is proprietary and must never appear in an artifact, under
          # any spelling. Cheap insurance against a fixture or doc drifting in.
          if grep -ri meshcim . >/dev/null 2>&1; then
            echo "::error::MeshCIM reference found in the bundle"; exit 1
          fi
          tar czf meshbench-linux-x86_64.tar.gz meshbench
          # GPL-3.0 section 6: whoever receives the binary can have the source
          # that made it. The repository is public, so a link to the tag would
          # satisfy that on its own. The archive travels with the release
          # anyway, because it pins the exact tree this binary was built from
          # and a tag does not once somebody moves one.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          (cd .. && git archive --format=tar.gz \
            --prefix="meshbench-${VERSION}/" -o "dist/meshbench-${VERSION}-source.tar.gz" HEAD)
          sha256sum *.tar.gz > SHA256SUMS   # AppImage and .deb are added after they are built
          # The smoke is the artifact, not the tree: unpack what users get and
          # ask it who it is. The graphical smoke stays on a real desktop
          # before tagging, per the plan's acceptance.
          mkdir /tmp/smoke && tar xzf meshbench-linux-x86_64.tar.gz -C /tmp/smoke
          /tmp/smoke/meshbench/meshbench workbench -version
          test -s /tmp/smoke/meshbench/LICENCES/INDEX.txt
          ls -la *.tar.gz SHA256SUMS

      - name: Desktop integration, AppImage and .deb
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi

          # An AppDir is just the tree an installed application would have.
          # linuxdeploy turns it into a single file that runs on any distro
          # above the glibc floor, which is the "just give me the thing"
          # download - Arch and Fedora included, with no packaging of ours.
          APP=dist/AppDir
          mkdir -p $APP/usr/bin $APP/usr/share/applications \
                   $APP/usr/share/metainfo $APP/usr/share/meshbench
          # radioserver too: it is 40 KB, and without it an installed
          # MeshBench cannot emulate even when the user supplies their own
          # QEMU. The emulators themselves stay out of the AppImage and the
          # .deb on size grounds - 110 MB against 26 - so those two are the
          # application, and the tarball is the batteries-included download.
          cp dist/meshbench/meshbench dist/meshbench/radioserver $APP/usr/bin/
          cp -r dist/meshbench/fixtures dist/meshbench/fonts \
                dist/meshbench/LICENCES $APP/usr/share/meshbench/
          cp packaging/meshbench.desktop $APP/usr/share/applications/
          cp packaging/io.github.meshbench.meshbench.metainfo.xml $APP/usr/share/metainfo/
          for px in 16 24 32 48 64 128 256 512; do
            d=$APP/usr/share/icons/hicolor/${px}x${px}/apps
            mkdir -p $d
            cp packaging/icons/meshbench-${px}.png $d/io.github.meshbench.meshbench.png
          done

          curl -fsSL -o /tmp/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy
          # No FUSE on the runner, so the tools have to unpack themselves.
          export APPIMAGE_EXTRACT_AND_RUN=1
          /tmp/linuxdeploy --appdir $APP --output appimage \
            -d packaging/meshbench.desktop \
            -i packaging/icons/meshbench-256.png \
            || echo "::warning::AppImage build failed; the tarball still stands"
          mv MeshBench*.AppImage dist/meshbench-${VERSION}-x86_64.AppImage 2>/dev/null || true

          # A .deb for our own apt repository. Depends names the real floor,
          # so apt refuses on a machine that cannot run it rather than
          # installing something that dies at launch.
          DEB=dist/deb
          mkdir -p $DEB/DEBIAN $DEB/usr/bin $DEB/usr/share/applications \
                   $DEB/usr/share/metainfo $DEB/usr/share/meshbench
          # From packaging/, not from the AppDir: linuxdeploy drops its own
          # copy of the icon in there under the source file's name, and that
          # stray meshbench-256.png would ride into the .deb's icon theme
          # where nothing looks for it.
          for px in 16 24 32 48 64 128 256 512; do
            d=$DEB/usr/share/icons/hicolor/${px}x${px}/apps
            mkdir -p $d
            cp packaging/icons/meshbench-${px}.png $d/io.github.meshbench.meshbench.png
          done
          cp $APP/usr/bin/meshbench $APP/usr/bin/radioserver $DEB/usr/bin/
          cp -r $APP/usr/share/meshbench/* $DEB/usr/share/meshbench/
          cp packaging/meshbench.desktop $DEB/usr/share/applications/
          cp packaging/io.github.meshbench.meshbench.metainfo.xml $DEB/usr/share/metainfo/
          cat > $DEB/DEBIAN/control <<CONTROL
          Package: meshbench
          Version: ${VERSION}
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: MeshBench <noreply@github.com>
          Depends: libc6 (>= 2.34), libgl1, libx11-6, libxkbcommon0, libwayland-client0, libvulkan1
          Description: Plan and test MeshCore LoRa networks against real firmware
           MeshBench runs real MeshCore firmware against a sample-accurate LoRa
           channel over real terrain, and says what arrived at the antenna and why.
          CONTROL
          sed -i 's/^          //' $DEB/DEBIAN/control
          dpkg-deb --build --root-owner-group $DEB dist/meshbench_${VERSION}_amd64.deb

          # Re-taken now that every downloadable exists. The Assemble step's
          # SHA256SUMS covered the tarballs alone, and a checksum file that
          # lists some of the artifacts is worse than none: it reads as
          # complete.
          (cd dist && rm -rf AppDir deb && sha256sum *.tar.gz *.AppImage *.deb 2>/dev/null > SHA256SUMS; cat SHA256SUMS)
          ls -la dist/

      # Only when something will consume it. The release job is the only
      # consumer and runs on `inputs.release`, so an upload without that is
      # 440 MB of Actions storage nobody collects.
      #
      # The quota that made this urgent was a private repository's: four runs
      # filled the account, and three test dispatches on 21 August filled it
      # again, which is how the release pipeline came to fail on its last
      # remaining step with the bundle already built and smoke-tested. A
      # public repository is not metered that way, so this is now about not
      # leaving half a gigabyte a run behind rather than about a bill.
      #
      # A build that does not upload still proves the pipeline: it fetches the
      # emulators, assembles, and runs the smoke test against what a user gets.
      - uses: actions/upload-artifact@v7
        if: inputs.release || startsWith(github.ref, 'refs/tags/v')
        with:
          name: meshbench-linux
          # These bundles are 30-110 MB each and three platforms upload one
          # per run, so a run leaves about 440 MB of Actions storage behind.
          # Four runs filled a private repository's quota; a public one has no
          # such quota, and the retention below is kept because none of it is
          # worth keeping rather than because it is billed.
          #
          # On a release run they are only the parcel the release job unwraps:
          # it republishes them as release assets, which is the copy that
          # lasts, and then deletes them. A day is a fallback for a release
          # job that never got there. A test build has no release to keep it,
          # so it gets three days to be downloaded in.
          retention-days: ${{ inputs.release && 1 || 3 }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS

  macos:
    timeout-minutes: 75
    # macos-14 is Apple Silicon and is the standard runner, not the xlarge -
    # larger runners are billed on every plan and fail with a message about
    # account payments, which is a confusing way to be told you picked the
    # expensive label.
    #
    # That label is history now rather than a live constraint. The 10x macOS
    # multiplier on a private repository is what first bought a Mac to run
    # this on; the repository is public, so standard hosted runners cost
    # nothing and cost is no longer an argument either way. What survives is
    # that the M4 is faster than a hosted macos-14, and that a runner we own
    # keeps release credentials off shared infrastructure. Moving back to
    # hosted is now a choice somebody could make on those two grounds, and
    # should be made on purpose rather than because a comment went stale.
    #
    # Skippable, because a dispatched test build has no reason to build the
    # dmg at all. Not to save money: nothing in this file is billed.
    # Alex's own Mac, as an org runner. package.yml runs only on tags and
    # manual dispatch - events that need write access - so nothing an
    # outsider does can schedule work on it. Hosted macos-14 was the paid leg
    # while this repository was private; now it is only that the M4 is faster.
    # A tag push carries no inputs, and a release with no Mac build in it is
    # not the release this job exists to make. The input still lets a
    # dispatched test build skip the Mac build.
    if: inputs.mac || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macos-m4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # 1.25, matching go.mod and ci.yml. Not cosmetic: the lab runners
        # set GOTOOLCHAIN=local, so Go may not fetch the toolchain go.mod
        # asks for - and every go command in this job died on
        # "go.mod requires go >= 1.25.0 (running go 1.24.13)".
        #
        # cache: false - every job in this file runs on a persistent
        # self-hosted runner (lab-2204, or the m4 pool), where the Go
        # caches already survive between jobs. See ci.yml for the detail.
        with: { go-version: '1.25', cache: false }

      - name: Build the bundle
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          packaging/macos-app.sh "$VERSION"

      - name: Fetch the emulators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Inside the bundle, not beside it. A dmg with the app and the
          # emulators as siblings looks fine and then loses the emulators the
          # moment somebody drags MeshBench to Applications, which is what
          # everybody does - and emulated boards would stop working for a
          # reason nobody could see.
          #
          # The same two scripts and the same pins the other two bundles use.
          # This job used to carry a curl-and-python fetcher of its own reading
          # /latest, which was a second answer to the question of what a
          # MeshBench build bundles, on a machine with no gh: the first build
          # here produced a 16 MB dmg with no emulators in it while the job
          # stayed green.
          . packaging/emulator-pins.env
          APP=dist/macos/MeshBench.app
          EMU="$APP/Contents/Resources/emulators"
          mkdir -p "$EMU"
          packaging/fetch-emulator.sh MeshBench/qemu "$QEMU_RELEASE" \
            "$QEMU_ASSET_DARWIN_ARM64" QEMU "$EMU"
          packaging/fetch-emulator.sh MeshBench/renode "$RENODE_RELEASE" \
            "$RENODE_ASSET_DARWIN_ARM64" Renode "$EMU"
          (cd "$EMU" && for f in *.tar.xz *.tar.gz; do [ -e "$f" ] || continue; tar xf "$f" && rm "$f"; done)
          # MeshBench looks for an executable file beside its own binary, so
          # the links live in MacOS/ and point into Resources/.
          if [ -d "$EMU/qemu" ]; then
            ln -sf ../Resources/emulators/qemu/bin/qemu-system-xtensa "$APP/Contents/MacOS/qemu-system-xtensa"
          fi
          if [ -f "$EMU/Release/osx-arm64/Renode" ]; then
            ln -sf ../Resources/emulators/Release/osx-arm64/Renode "$APP/Contents/MacOS/renode"
          fi
          # The radio model. A real file rather than a link: it is 40 KB and
          # resolves nothing from its own path.
          tools/fetch-release-asset.sh MeshBench/meshcore-native "$RADIOSERVER_RELEASE" \
            "/$RADIOSERVER_ASSET_DARWIN_ARM64\$" "$APP/Contents/MacOS"
          mv "$APP/Contents/MacOS/$RADIOSERVER_ASSET_DARWIN_ARM64" "$APP/Contents/MacOS/radioserver"
          chmod +x "$APP/Contents/MacOS/radioserver"
          # What the app actually carries, asked the way a node asks, before it
          # is signed and sealed into a dmg nobody will open again.
          packaging/verify-bundle.sh "$APP/Contents/MacOS" darwin-arm64
          # Signing has to happen again: the bundle was signed before these
          # arrived, and adding files to a signed bundle invalidates it.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP" 2>&1 | tail -2
          ls -la "$APP/Contents/MacOS"

      - name: Repack the dmg with the emulators in it
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          rm -f dist/MeshBench-*.dmg
          # The same script the bundle step used, not a bare hdiutil create: an
          # image built the plain way has the app in it and nothing to drag it
          # onto, so people run MeshBench off the mounted volume and lose it
          # when they eject. macos-dmg.sh mounts what it wrote and asserts the
          # Applications alias is on it before this step can pass.
          packaging/macos-dmg.sh "$VERSION" dist/macos "dist/MeshBench-${VERSION}-arm64.dmg"
          ls -la dist/*.dmg
          shasum -a 256 dist/*.dmg

      - uses: actions/upload-artifact@v7
        if: inputs.release || startsWith(github.ref, 'refs/tags/v')
        with:
          name: meshbench-macos
          # As the Linux upload above: the release job deletes these once it
          # has republished them as release assets.
          retention-days: ${{ inputs.release && 1 || 3 }}
          path: dist/*.dmg
  windows:
    timeout-minutes: 60
    # Cross-compiled from Linux with mingw rather than built on a Windows
    # runner: Gio's Windows backend and wgpu both build that way, so the job
    # needs nothing from Windows itself. The 2x Windows multiplier decided
    # this when the repository was private and no longer applies, but the
    # cross-build is kept because it is one runner pool and one toolchain
    # rather than two, and because windows-check.yml is what actually proves
    # the result on Windows.
    #
    # This produces the application, and the zip carries both emulators and the
    # radio model beside it. A node on Windows asks for ":0" and reaches the
    # radio model over TCP for both emulators, so nothing here depends on a
    # Unix socket. What a Windows user does not get is the runtime fetch: the
    # catalogue reads ELF and Mach-O headers rather than PE, so the zip is the
    # only way the emulators arrive.
    # As above: the input is for a cheap test build, not for deciding what a
    # real release contains.
    if: inputs.windows || startsWith(github.ref, 'refs/tags/v')
    # lab-2204 is the one Ubuntu 22.04 runner in the pool, and that is the
    # whole point of the label - it pins the glibc floor described above. Do
    # not widen this to lab-linux; the other two are 24.04 and would raise it.
    #
    # No fork guard here: this workflow only triggers on tag pushes and
    # workflow_dispatch, both of which need write access to this repo.
    runs-on: [self-hosted, linux, x64, lab-2204]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # 1.25, matching go.mod and ci.yml. Not cosmetic: the lab runners
        # set GOTOOLCHAIN=local, so Go may not fetch the toolchain go.mod
        # asks for - and every go command in this job died on
        # "go.mod requires go >= 1.25.0 (running go 1.24.13)".
        #
        # cache: false - every job in this file runs on a persistent
        # self-hosted runner (lab-2204, or the m4 pool), where the Go
        # caches already survive between jobs. See ci.yml for the detail.
        with: { go-version: '1.25', cache: false }

      - name: Dependencies
        run: |
          sudo apt-get update
          # msitools is msiinfo and msibuild: one reads the built package for
          # verify-msi.sh and the other puts back the single row WiX will not
          # author. wixl used to build the installer and no longer does - it
          # builds no dialogs, and the installer was asked for two.
          # icoutils is for the one file Windows wants that the repository does
          # not carry: an .ico holding every size, built from the committed
          # PNGs the same way macos-app.sh builds the .icns. ImageMagick makes
          # the dialog bitmaps from the same committed artwork, for the same
          # reason and because WixUI takes bitmaps rather than PNGs.
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 zip msitools icoutils imagemagick

      # The WiX toolset, which is what builds the installer now. A .NET tool,
      # so it runs on this Linux runner and the "no Windows runner" property
      # that has always held for this job still holds.
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0' }
      - name: WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        # The cross-compile variables go on the one command that cross
        # compiles. As step-level env they also applied to `go run`, which
        # then built a Windows licgen.exe and tried to execute it on Linux -
        # where mono met it and said the file is not a valid CIL image, which
        # is a confusing way to be told the tools ran in the wrong direction.
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          # The same guard the Linux build carries, for the same reason.
          case "$VERSION" in *-dev-*) ;; *)
            echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' ||
              { echo "::error::version '$VERSION' is not a plain X.Y.Z"; exit 1; } ;;
          esac
          go run ./tools/licgen -text dist/meshbench/LICENCES
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc \
          go build -trimpath \
            -ldflags "-H windowsgui -X gioui.org/app.ID=io.github.meshbench.meshbench \
              -X github.com/MeshBench/meshbench/internal/world/basemap.defaultCartoKey=${CARTO_API_KEY} \
                      -X github.com/MeshBench/meshbench/internal/app/version.Version=v$VERSION" \
            -o dist/meshbench/meshbench.exe ./cmd/meshbench
          cp -r fixtures dist/meshbench/fixtures
          cp packaging/icons/meshbench-256.png dist/meshbench/meshbench.png

          # The emulators, same scripts and same pins as the Linux tarball and
          # the macOS bundle. A zip cannot carry symlinks, so nothing is
          # linked: lookupTool knows the unpacked layouts
          # (qemu/bin/qemu-system-xtensa.exe, renode_*-portable/renode.exe) and
          # the .exe suffix, and searches them beside the binary.
          . packaging/emulator-pins.env
          packaging/fetch-emulator.sh MeshBench/qemu "$QEMU_RELEASE" \
            "$QEMU_ASSET_WINDOWS_AMD64" QEMU dist/meshbench
          packaging/fetch-emulator.sh MeshBench/renode "$RENODE_RELEASE" \
            "$RENODE_ASSET_WINDOWS_AMD64" Renode dist/meshbench
          cd dist/meshbench
          for f in *.tar.xz *.tar.gz; do [ -e "$f" ] || continue; tar xf "$f" && rm "$f"; done
          for f in *.zip; do [ -e "$f" ] || continue; unzip -q "$f" && rm "$f"; done
          ls -la
          cd ../..

          # The radio model. It takes the TCP transport - the simulator asks
          # for ":0" on Windows for both emulators, because Windows has no
          # Unix socket mingw can reach.
          tools/fetch-release-asset.sh MeshBench/meshcore-native "$RADIOSERVER_RELEASE" \
            "/$RADIOSERVER_ASSET_WINDOWS_AMD64\$" dist/meshbench
          mv "dist/meshbench/$RADIOSERVER_ASSET_WINDOWS_AMD64" dist/meshbench/radioserver.exe
          file dist/meshbench/radioserver.exe
          # What the zip actually carries, asked the way a node asks.
          packaging/verify-bundle.sh dist/meshbench windows-amd64
          cat > dist/meshbench/README.txt <<'TXT'
          MeshBench for Windows

          Run meshbench.exe - it opens the workbench. From a terminal,
          `meshbench.exe workbench` does the same and `meshbench.exe -version`
          says which build this is.

          Native MeshCore firmware is downloaded on first use and cached.

          There is an installer beside this zip on the releases page,
          meshbench-<version>-windows-x86_64.msi. It puts this same directory
          somewhere deliberate, adds a Start menu entry and an entry in Apps
          and Features, and upgrades in place. This zip is the one to take for
          a memory stick, a build agent, or anywhere an installer is unwanted.

          Whichever emulators are published for Windows are in this zip, with
          radioserver.exe, the SX1262 model they clock over a socket. They are
          found automatically, and they are MeshBench builds rather than
          upstream ones - ours carry an SX1262 device and a SEVONPEND fix that
          published firmware needs.

          Help > Setup cannot download a replacement on Windows - it reads ELF
          and Mach-O headers rather than PE - so the zip is where they come
          from. To use one of your own, put it beside meshbench.exe or point
          MESHBENCH_QEMU, MESHBENCH_RENODE or MESHBENCH_RADIO_SERVER at it.

          Emulated boards on Windows are newer than the rest of this bundle
          and have had less time on real hardware than the Linux and macOS
          ones. If a board will not start, meshbench.exe workbench run from a
          terminal prints what it could not find.

          Licences are in LICENCES\, and in the application under
          Help > Licences & attributions.
          TXT
          (cd dist && zip -qr meshbench-${VERSION}-windows-x86_64.zip meshbench)
          ls -la dist/*.zip
          file dist/meshbench/meshbench.exe

      - name: The installer
        # An MSI as well as the zip rather than instead of it. The zip is a
        # complete build and stays the download for a memory stick, a build
        # agent, or anyone who wants no installer.
        #
        # What the installer adds is a deliberate location. This bundle finds
        # the emulators and radioserver.exe beside meshbench.exe, so a user who
        # unpacks the zip into Downloads and then moves the one executable
        # somewhere tidy - which is the natural thing to do with a single
        # executable - has broken emulation and will not be told why. The
        # installer puts the whole directory somewhere on purpose, and brings
        # an entry in Apps and Features, an uninstall, and an upgrade that
        # replaces the previous version instead of accumulating beside it.
        #
        # Still no Windows runner: WiX reads packaging/meshbench.wxs and
        # writes the .msi here, beside the mingw cross-build that made the
        # .exe. The script checks the tables of what it built before it
        # returns, because an installer that is wrong about upgrading looks
        # exactly like one that is right until somebody installs two versions.
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          packaging/windows-msi.sh dist/meshbench "$VERSION" \
            "dist/meshbench-${VERSION}-windows-x86_64.msi"
          ls -la dist/*.msi

      - uses: actions/upload-artifact@v7
        if: inputs.release || startsWith(github.ref, 'refs/tags/v')
        with:
          name: meshbench-windows
          # As the Linux upload above.
          retention-days: ${{ inputs.release && 1 || 3 }}
          path: |
            dist/*.zip
            dist/*.msi

  release:
    timeout-minutes: 20
    # One release, once every platform has built. Publishing per-job would put
    # the Linux downloads on a release page that has no Mac or Windows build
    # in it yet, which is a release somebody downloads halfway through.
    #
    # always(), so a platform that fails does not withhold the ones that
    # worked - but the tarball and the AppImage are required below, because a
    # release missing the thing most people came for is worse than no release.
    #
    # The ref decides, not just the dispatch input. This workflow triggers on a
    # v* tag push, where inputs.* is empty, so gating on inputs.release alone
    # meant a pushed tag built all three platforms and then published nothing,
    # silently: the obvious way to cut a release was the way that did not work.
    # publish-clients.yml already reads the ref for the same reason.
    if: always() && (inputs.release || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, macos, windows]
    # lab-2204 is the one Ubuntu 22.04 runner in the pool, and that is the
    # whole point of the label - it pins the glibc floor described above. Do
    # not widen this to lab-linux; the other two are 24.04 and would raise it.
    #
    # No fork guard here: this workflow only triggers on tag pushes and
    # workflow_dispatch, both of which need write access to this repo.
    runs-on: [self-hosted, linux, x64, lab-2204]
    permissions:
      contents: write
      # actions: write is for the tidy step at the end, which deletes the
      # build artifacts once they are release assets.
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # 1.25, matching go.mod and ci.yml. Not cosmetic: the lab runners
        # set GOTOOLCHAIN=local, so Go may not fetch the toolchain go.mod
        # asks for - and every go command in this job died on
        # "go.mod requires go >= 1.25.0 (running go 1.24.13)".
        #
        # cache: false - every job in this file runs on a persistent
        # self-hosted runner (lab-2204, or the m4 pool), where the Go
        # caches already survive between jobs. See ci.yml for the detail.
        with: { go-version: '1.25', cache: false }
      - uses: actions/download-artifact@v8
        with: { path: incoming }

      # This job is the one that still needs gh: creating and uploading a
      # release is a write, and reimplementing that over curl would be a worse
      # thing than depending on the tool. The build jobs no longer need it.
      #
      # Checked here so a runner without it fails on its own account, before
      # three platforms' worth of artifacts have been collected and named.
      - name: gh, which this job publishes with
        run: |
          command -v gh >/dev/null || {
            echo "::error::gh is not installed on this runner, and the release step"\
                 "publishes with it. Install it, or run this job somewhere that has it."
            exit 1
          }
          gh --version | head -1

      - name: Collect
        run: |
          set -e
          mkdir -p dist
          find incoming -type f \( -name '*.tar.gz' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.zip' -o -name '*.msi' \
            -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Refuse a release nobody can use
        run: |
          set -e
          # The Linux downloads are the ones this release exists for today.
          # macOS and Windows are allowed to be missing and say so in the
          # notes; Linux missing means something went wrong upstream of here.
          ls dist/*.AppImage >/dev/null || { echo "::error::no AppImage"; exit 1; }
          ls dist/meshbench-linux-x86_64.tar.gz >/dev/null || { echo "::error::no Linux tarball"; exit 1; }
          # Windows may be missing entirely and the notes say so. Half of it is
          # the thing to refuse: a zip with no installer beside it looks exactly
          # like a release that never had one, and that is how this project has
          # shipped a bundle with no emulators in it more than once.
          if ls dist/*windows*.zip >/dev/null 2>&1 && ! ls dist/*windows*.msi >/dev/null 2>&1; then
            echo "::error::a Windows zip was built and no .msi came with it;"\
                 "the installer is packaging/meshbench.wxs, built by the"\
                 "windows job's installer step"
            exit 1
          fi
          # And the project still has to have a licence to be given away.
          go run ./tools/licgen -require-project-licence

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  echo "::error::set a version to release"; exit 1 ;;
            esac
          fi
          TAG="v${VERSION}"

          # GPL-3.0 section 6: whoever gets the binary can have the source.
          git archive --format=tar.gz --prefix="meshbench-${VERSION}/" \
            -o "dist/meshbench-${VERSION}-source.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

          {
            echo "## Installing"
            echo
            echo "See the [quick start](https://github.com/MeshBench/meshbench#install-and-run) for each platform."
            echo
            echo "| platform | download | notes |"
            echo "|---|---|---|"
            ls dist/*.AppImage >/dev/null 2>&1 && echo "| Linux | \`.AppImage\` | one file, any distribution |"
            ls dist/*.deb >/dev/null 2>&1 && echo "| Debian, Ubuntu | \`.deb\` | \`sudo apt install ./meshbench_*.deb\` |"
            ls dist/meshbench-linux-x86_64.tar.gz >/dev/null 2>&1 && echo "| Linux | \`.tar.gz\` | includes the QEMU and Renode emulators |"
            ls dist/*.dmg >/dev/null 2>&1 && echo "| macOS (Apple Silicon) | \`.dmg\` | drag MeshBench onto Applications, then right-click Open once: **unsigned** |" || echo "| macOS | - | did not build for this release |"
            # || true, because this row is the one with no "did not build"
            # fallback under it, and set -e would otherwise end the step here
            # on a release with no Windows leg.
            ls dist/*.msi >/dev/null 2>&1 && echo "| Windows | \`.msi\` | installs to Program Files, Start menu entry, upgrades in place |" || true
            ls dist/*.zip >/dev/null 2>&1 && echo "| Windows | \`.zip\` | no installer: unpack it and run \`meshbench.exe\` |" || echo "| Windows | - | did not build for this release |"
            echo
            echo "Neither the macOS nor the Windows build is code-signed yet, so both"
            echo "operating systems will object the first time. The README says exactly"
            echo "what they say and how to proceed."
            echo
            echo "\`SHA256SUMS\` covers every file here. MeshBench is GPL-3.0-or-later,"
            echo "so the source for these binaries is this repository at \`$TAG\`; the"
            echo "source archive beside them is that same tree, pinned, so a copy of"
            echo "the bundle carries its own source wherever it ends up."
          } > /tmp/notes.md

          gh release create "$TAG" dist/* --target "${GITHUB_SHA}" \
            --title "MeshBench $VERSION" --notes-file /tmp/notes.md \
            || gh release upload "$TAG" dist/* --clobber

      - name: Put the parcels out
        # The bundles are release assets now, and that is the copy that
        # lasts. Leaving the same 440 MB in Actions storage as well is a
        # duplicate of something already published. It used to be a bill too:
        # four release runs filled this account's storage quota back when the
        # repository was private. That quota is gone and the duplicate is not.
        #
        # After the publish, and only when it worked - a release job that
        # failed is one somebody re-runs, and re-running it needs the
        # artifacts to still be there.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          freed=0
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                        --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" && freed=$((freed+1))
          done
          echo "deleted $freed build artifacts; the release page keeps the copies that matter"
