name: package

# A bundle somebody can download and run, with the emulators inside it.
#
# Linux only for now, deliberately. macOS and Windows are visible below and
# skipped, with the reason in the file: an absent row gets forgotten, a skipped
# one with a reason gets picked up.
#
# The plan this implements is docs/release-packaging-plan.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.0.1 (blank builds without releasing)'
        type: string
        default: ''
      release:
        description: 'Publish a release from this build'
        type: boolean
        default: false
      mac:
        description: 'Build the macOS dmg (hosted macOS minutes bill at 10x on a private repo - leave off for a test build)'
        type: boolean
        default: true
      windows:
        description: 'Build the Windows zip (cross-compiled on Linux, so free)'
        type: boolean
        default: true

jobs:
  linux:
    # The oldest base that can link. This used to be 24.04 because cimgui-go
    # shipped a prebuilt cimgui.a referencing __isoc23_sscanf, a symbol glibc
    # only grew in 2.38 - a dependency's floor showing through as several
    # hundred undefined references. workbench1 and internal/ui are gone, so
    # nothing links cimgui and the floor is now the runner's own glibc: 2.35,
    # which reaches Ubuntu 22.04, Debian 12 and RHEL 9.
    #
    # Build on the oldest base you intend to support, because glibc symbol
    # versioning is one-way: a binary linked against 2.35 runs on 2.38, and
    # never the other way round.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }

      - name: Dependencies
        run: |
          sudo apt-get update
          # cgo through Gio and wgpu, so this is a native build and not a
          # cross-compile. GL, X11, Wayland, xkbcommon, EGL and Vulkan headers
          # are all needed to link even though the binary can run headless.
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libffi-dev

      - name: Licences are fresh
        # The window shows what the binary links. Regenerate and diff: a new
        # dependency without a licence entry fails here, not in a lawyer's
        # inbox. licgen itself fails on a module whose licence it cannot name.
        run: |
          go run ./tools/licgen
          git diff --exit-code -- internal/workbench/licences/licences.json

      - name: Build and check
        run: |
          set -e
          test -z "$(gofmt -l ./cmd ./internal ./tools)"
          go vet ./...
          # -short: the long tests boot real firmware and measure run-to-run
          # spread, which needs an idle machine - a shared runner fails the
          # noise-floor measurement on load, not on code. The full suite is
          # ci.yml's job; this gate is that the artifact builds and works.
          go test -short ./...
          # One binary, one workbench: `meshbench workbench` is the Gio app,
          # and the imgui one it replaced has been deleted.
          #
          # The app ID is set here rather than left to default. Gio takes the
          # Wayland app_id and the X11 class from it, and the default is the
          # binary's own name - so a taskbar grouping and a window-manager rule
          # would otherwise key on whatever the file happened to be called.
          #
          # Reverse DNS wants a domain the project controls, and MeshBench owns
          # no domain - so it takes the form for a GitHub-hosted project, which
          # is what Flathub asks for too. It follows the org, not a person.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          go build -trimpath \
            -ldflags "-X gioui.org/app.ID=io.github.meshbench.meshbench \
                      -X github.com/MeshBench/meshbench/internal/workbench.Version=$VERSION" \
            -o dist/meshbench/meshbench ./cmd/meshcoresim

      - name: Fetch the emulators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist/meshbench
          # Both are our forks and neither can be a distribution build: ours
          # carry the SX1262 device and the SEVONPEND fix respectively, and a
          # stock build of either runs, reports no chip or hangs, and looks like
          # our fault. The changes are deliberately not upstreamed, so the
          # forks' own release artifacts carry a meshbench mark in the name -
          # nobody should mistake one for an upstream build. The patterns
          # wildcard around it rather than pinning where in the name it sits.
          #
          # QEMU's archives are .tar.xz and carry the target in the name;
          # only the Xtensa one runs ESP32 firmware, so the riscv32 build in
          # the same release is deliberately not downloaded.
          gh release download --repo MeshBench/qemu --pattern '*xtensa*x86_64-linux-gnu.tar.xz' \
            --dir . --clobber || echo "::warning::no QEMU release yet, bundle ships without it"
          gh release download --repo MeshBench/renode --pattern '*linux*portable*meshbench*.tar.gz' \
            --dir . --clobber || echo "::warning::no Renode release yet, bundle ships without it"
          # -xf rather than -xzf: the two forks package differently and the
          # bundle should not care which. tar reads the compression itself.
          for f in *.tar.gz *.tar.xz; do [ -e "$f" ] || continue; tar xf "$f" && rm "$f"; done
          ls -la

      - name: Fonts and fixtures
        run: |
          set -e
          # Emoji in node names should not depend on the user's font packages;
          # withEmoji() looks in fonts/ beside the binary first. OFL-1.1, and
          # the licence window carries the attribution.
          mkdir -p dist/meshbench/fonts
          curl -fsSL -o dist/meshbench/fonts/NotoColorEmoji.ttf \
            https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf \
            || echo "::warning::emoji font not fetched, bundle falls back to system fonts"
          # The shipped fixtures, so the workbench has something to open on a
          # machine with nothing else on it.
          cp -r fixtures dist/meshbench/fixtures

      - name: Assemble
        run: |
          set -e
          cd dist/meshbench
          # The same inventory the Help > Licences window shows, as files, for
          # the people who read a directory rather than open a window.
          (cd ../.. && go run ./tools/licgen -text dist/meshbench/LICENCES)
          # Beside the binary is where MeshBench looks second, after the
          # environment variable and before its cache. A desktop application is
          # not launched from a shell, so PATH is nearly useless to it.
          # Both emulators unpack into their own directory, and MeshBench
          # looks for an executable *file* beside its own binary - so each
          # needs a symlink or the bundle contains an emulator nobody can
          # find. Renode's directory carries its version, so match on the
          # shape rather than a name that changes with every release.
          for d in qemu qemu-meshbench; do
            [ -d "$d" ] && ln -sf "$d/bin/qemu-system-xtensa" . && break
          done
          for d in renode_*-portable renode-*-portable renode; do
            [ -x "$d/renode" ] && ln -sf "$d/renode" . && break
          done
          ls -la qemu-system-xtensa renode 2>&1 || \
            echo "::warning::an emulator symlink is missing; the bundle has it but MeshBench will not find it"
          cat > README.txt <<'TXT'
          MeshBench

          Run ./meshbench workbench

          Needs a GPU with Vulkan or GL.

          MeshBench is free software under the GNU General Public Licence,
          version 3 or later. The full terms are in LICENCES/, and the source
          for this exact build is the meshbench-*-source.tar.gz published beside
          it on the release page.

          The emulators beside this file are found automatically. They are not
          distribution builds and cannot be: the QEMU carries an SX1262 device
          upstream does not have, and the Renode carries a SEVONPEND fix without
          which published nRF52 firmware sleeps for ever. Their release
          artifacts say meshbench in the name for that reason - these forks are
          built for this simulator and are not upstream releases.

          qemu-system-xtensa is a symlink on purpose. QEMU resolves its own path
          to find its data files, so a bare copy of the binary will not run.

          Native MeshCore builds and board images are downloaded on first use and
          cached under ~/.cache/meshcoresim. Nothing else is needed.

          Needs glibc 2.35 or newer: Ubuntu 22.04, Debian 12, RHEL 9, or
          anything more recent.

          Everything this bundle ships under is in LICENCES/, and in the
          application under Help > Licences & attributions.
          TXT
          cd ..
          # MeshCIM is proprietary and must never appear in an artifact, under
          # any spelling. Cheap insurance against a fixture or doc drifting in.
          if grep -ri meshcim . >/dev/null 2>&1; then
            echo "::error::MeshCIM reference found in the bundle"; exit 1
          fi
          tar czf meshbench-linux-x86_64.tar.gz meshbench
          # GPL-3.0 section 6: whoever receives the binary can have the source
          # that made it. The repository is private for now, so the source
          # travels with the release rather than being a link. When the
          # repository goes public this can become a URL in the notes.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          (cd .. && git archive --format=tar.gz \
            --prefix="meshbench-${VERSION}/" -o "dist/meshbench-${VERSION}-source.tar.gz" HEAD)
          sha256sum *.tar.gz > SHA256SUMS   # AppImage and .deb are added after they are built
          # The smoke is the artifact, not the tree: unpack what users get and
          # ask it who it is. The graphical smoke stays on a real desktop
          # before tagging, per the plan's acceptance.
          mkdir /tmp/smoke && tar xzf meshbench-linux-x86_64.tar.gz -C /tmp/smoke
          /tmp/smoke/meshbench/meshbench workbench -version
          test -s /tmp/smoke/meshbench/LICENCES/INDEX.txt
          ls -la *.tar.gz SHA256SUMS

      - name: Desktop integration, AppImage and .deb
        run: |
          set -e
          go run ./tools/icon
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi

          # An AppDir is just the tree an installed application would have.
          # linuxdeploy turns it into a single file that runs on any distro
          # above the glibc floor, which is the "just give me the thing"
          # download - Arch and Fedora included, with no packaging of ours.
          APP=dist/AppDir
          mkdir -p $APP/usr/bin $APP/usr/share/applications \
                   $APP/usr/share/metainfo $APP/usr/share/meshbench
          cp dist/meshbench/meshbench $APP/usr/bin/
          cp -r dist/meshbench/fixtures dist/meshbench/fonts \
                dist/meshbench/LICENCES $APP/usr/share/meshbench/
          cp packaging/meshbench.desktop $APP/usr/share/applications/
          cp packaging/io.github.meshbench.meshbench.metainfo.xml $APP/usr/share/metainfo/
          for px in 16 24 32 48 64 128 256 512; do
            d=$APP/usr/share/icons/hicolor/${px}x${px}/apps
            mkdir -p $d
            cp packaging/icons/meshbench-${px}.png $d/io.github.meshbench.meshbench.png
          done

          curl -fsSL -o /tmp/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy
          # No FUSE on the runner, so the tools have to unpack themselves.
          export APPIMAGE_EXTRACT_AND_RUN=1
          /tmp/linuxdeploy --appdir $APP --output appimage \
            -d packaging/meshbench.desktop \
            -i packaging/icons/meshbench-256.png \
            || echo "::warning::AppImage build failed; the tarball still stands"
          mv MeshBench*.AppImage dist/meshbench-${VERSION}-x86_64.AppImage 2>/dev/null || true

          # A .deb for our own apt repository. Depends names the real floor,
          # so apt refuses on a machine that cannot run it rather than
          # installing something that dies at launch.
          DEB=dist/deb
          mkdir -p $DEB/DEBIAN $DEB/usr/bin $DEB/usr/share/applications \
                   $DEB/usr/share/metainfo $DEB/usr/share/meshbench
          # From packaging/, not from the AppDir: linuxdeploy drops its own
          # copy of the icon in there under the source file's name, and that
          # stray meshbench-256.png would ride into the .deb's icon theme
          # where nothing looks for it.
          for px in 16 24 32 48 64 128 256 512; do
            d=$DEB/usr/share/icons/hicolor/${px}x${px}/apps
            mkdir -p $d
            cp packaging/icons/meshbench-${px}.png $d/io.github.meshbench.meshbench.png
          done
          cp $APP/usr/bin/meshbench $DEB/usr/bin/
          cp -r $APP/usr/share/meshbench/* $DEB/usr/share/meshbench/
          cp packaging/meshbench.desktop $DEB/usr/share/applications/
          cp packaging/io.github.meshbench.meshbench.metainfo.xml $DEB/usr/share/metainfo/
          cat > $DEB/DEBIAN/control <<CONTROL
          Package: meshbench
          Version: ${VERSION}
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: MeshBench <noreply@github.com>
          Depends: libc6 (>= 2.34), libgl1, libx11-6, libxkbcommon0, libwayland-client0, libvulkan1
          Description: Plan and test MeshCore LoRa networks against real firmware
           MeshBench runs real MeshCore firmware against a sample-accurate LoRa
           channel over real terrain, and says what arrived at the antenna and why.
          CONTROL
          sed -i 's/^          //' $DEB/DEBIAN/control
          dpkg-deb --build --root-owner-group $DEB dist/meshbench_${VERSION}_amd64.deb

          # Re-taken now that every downloadable exists. The Assemble step's
          # SHA256SUMS covered the tarballs alone, and a checksum file that
          # lists some of the artifacts is worse than none: it reads as
          # complete.
          (cd dist && rm -rf AppDir deb && sha256sum *.tar.gz *.AppImage *.deb 2>/dev/null > SHA256SUMS; cat SHA256SUMS)
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: meshbench-linux
          # Days, not the default ninety. These bundles are 30-110 MB each and
          # a tagged release keeps its own copy for ever as a release asset -
          # so a long retention here buys nothing and quietly fills the
          # account's Actions storage, which is metered separately from
          # minutes and fails the billing check on its own.
          retention-days: 5
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS

  macos:
    # macos-14 is Apple Silicon and is the standard runner, not the xlarge -
    # larger runners are billed on every plan and fail with a message about
    # account payments, which is a confusing way to be told you picked the
    # expensive label.
    #
    # Hosted minutes bill at 10x on a private repository, which is affordable
    # here precisely because this workflow runs on tags and manual dispatch
    # only, never on push: a release build is about three minutes, so roughly
    # thirty billable minutes a release. If it ever moves to per-push, move it
    # to a Mac we own at the same time.
    # Skippable, because this is the only leg that costs anything: Linux and
    # Windows both run on Linux runners, which are free even here. A test
    # build should not spend thirty billable minutes proving the dmg still
    # packs.
    # Alex's own Mac, as an org runner. package.yml runs only on tags and
    # manual dispatch - events that need write access - so nothing an
    # outsider does can schedule work on it. Hosted macos-14 was the paid
    # leg on this private repository; the M4 is free and faster.
    if: inputs.mac
    runs-on: [self-hosted, macos-m4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }

      - name: Build the bundle
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          packaging/macos-app.sh "$VERSION"

      - name: Fetch the emulators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Inside the bundle, not beside it. A dmg with the app and the
          # emulators as siblings looks fine and then loses the emulators the
          # moment somebody drags MeshBench to Applications, which is what
          # everybody does - and emulated boards would stop working for a
          # reason nobody could see.
          APP=dist/macos/MeshBench.app
          mkdir -p "$APP/Contents/Resources/emulators"
          cd "$APP/Contents/Resources/emulators"
          gh release download --repo MeshBench/qemu \
            --pattern '*xtensa*aarch64-apple-darwin.tar.xz' --dir . --clobber \
            || echo "::warning::no macOS QEMU release yet; ESP32 boards will not emulate"
          gh release download --repo MeshBench/renode \
            --pattern '*macos*.tar.gz' --dir . --clobber \
            || echo "::warning::no macOS Renode release yet; nRF52 boards will not emulate"
          for f in *.tar.xz *.tar.gz; do [ -e "$f" ] || continue; tar xf "$f" && rm "$f"; done
          cd - >/dev/null
          # MeshBench looks for an executable file beside its own binary, so
          # the links live in MacOS/ and point into Resources/.
          [ -d "$APP/Contents/Resources/emulators/qemu" ] && \
            ln -sf ../Resources/emulators/qemu/bin/qemu-system-xtensa "$APP/Contents/MacOS/qemu-system-xtensa"
          [ -f "$APP/Contents/Resources/emulators/Release/osx-arm64/Renode" ] && \
            ln -sf ../Resources/emulators/Release/osx-arm64/Renode "$APP/Contents/MacOS/renode"
          # Signing has to happen again: the bundle was signed before these
          # arrived, and adding files to a signed bundle invalidates it.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP" 2>&1 | tail -2
          ls -la "$APP/Contents/MacOS"

      - name: Repack the dmg with the emulators in it
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          rm -f dist/MeshBench-*.dmg
          hdiutil create -quiet -volname "MeshBench $VERSION" -srcfolder dist/macos \
            -ov -format UDZO "dist/MeshBench-${VERSION}-arm64.dmg"
          ls -la dist/*.dmg
          shasum -a 256 dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: meshbench-macos
          retention-days: 5
          path: dist/*.dmg
  windows:
    # Cross-compiled from Linux with mingw rather than built on a Windows
    # runner: Gio's Windows backend and wgpu both build that way, and Windows
    # minutes bill at 2x on a private repository for a build that needs
    # nothing from Windows itself.
    #
    # This produces the application. Emulated ESP32 boards still need
    # radioserver's QEMU transport to stop assuming Unix sockets - the TCP
    # path it already has for Renode is what that wants - so a Windows user
    # gets the workbench and native firmware, and the honest line about
    # emulated boards.
    if: inputs.windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 zip

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        # The cross-compile variables go on the one command that cross
        # compiles. As step-level env they also applied to `go run`, which
        # then built a Windows licgen.exe and tried to execute it on Linux -
        # where mono met it and said the file is not a valid CIL image, which
        # is a confusing way to be told the tools ran in the wrong direction.
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  VERSION="0.0.0-dev-$(git rev-parse --short HEAD)" ;;
            esac
          fi
          go run ./tools/licgen -text dist/meshbench/LICENCES
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc \
          go build -trimpath \
            -ldflags "-H windowsgui -X gioui.org/app.ID=io.github.meshbench.meshbench \
                      -X github.com/MeshBench/meshbench/internal/workbench.Version=$VERSION" \
            -o dist/meshbench/meshbench.exe ./cmd/meshcoresim
          cp -r fixtures dist/meshbench/fixtures
          go run ./tools/icon && cp packaging/icons/meshbench-256.png dist/meshbench/meshbench.png

          # The emulators, same as the Linux tarball and the macOS bundle. A
          # zip cannot carry symlinks, so nothing is linked: lookupTool knows
          # the unpacked layouts (qemu/bin/qemu-system-xtensa.exe) and the
          # .exe suffix, and searches them beside the binary.
          cd dist/meshbench
          gh release download --repo MeshBench/qemu \
            --pattern '*xtensa*x86_64-w64-mingw32.tar.xz' --dir . --clobber \
            || echo "::warning::no Windows QEMU release; ESP32 boards will not emulate"
          gh release download --repo MeshBench/renode \
            --pattern '*windows*' --dir . --clobber \
            || echo "::warning::no Windows Renode release; nRF52 boards will not emulate"
          for f in *.tar.xz *.tar.gz; do [ -e "$f" ] || continue; tar xf "$f" && rm "$f"; done
          for f in *.zip; do [ -e "$f" ] || continue; unzip -q "$f" && rm "$f"; done
          ls -la
          cd ../..
          cat > dist/meshbench/README.txt <<'TXT'
          MeshBench for Windows

          Run meshbench.exe - it opens the workbench. From a terminal,
          `meshbench.exe workbench` does the same and `meshbench.exe -version`
          says which build this is.

          Native MeshCore firmware is downloaded on first use and cached.
          The QEMU and Renode emulators are in this zip, so emulated ESP32
          and nRF52 boards work out of the box. They are MeshBench builds,
          not upstream ones - ours carry an SX1262 device and a SEVONPEND
          fix that published firmware needs.

          Licences are in LICENCES\, and in the application under
          Help > Licences & attributions.
          TXT
          (cd dist && zip -qr meshbench-${VERSION}-windows-x86_64.zip meshbench)
          ls -la dist/*.zip
          file dist/meshbench/meshbench.exe

      - uses: actions/upload-artifact@v4
        with:
          name: meshbench-windows
          retention-days: 5
          path: dist/*.zip

  release:
    # One release, once every platform has built. Publishing per-job would put
    # the Linux downloads on a release page that has no Mac or Windows build
    # in it yet, which is a release somebody downloads halfway through.
    #
    # always(), so a platform that fails does not withhold the ones that
    # worked - but the tarball and the AppImage are required below, because a
    # release missing the thing most people came for is worse than no release.
    if: always() && inputs.release
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }
      - uses: actions/download-artifact@v4
        with: { path: incoming }

      - name: Collect
        run: |
          set -e
          mkdir -p dist
          find incoming -type f \( -name '*.tar.gz' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.zip' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Refuse a release nobody can use
        run: |
          set -e
          # The Linux downloads are the ones this release exists for today.
          # macOS and Windows are allowed to be missing and say so in the
          # notes; Linux missing means something went wrong upstream of here.
          ls dist/*.AppImage >/dev/null || { echo "::error::no AppImage"; exit 1; }
          ls dist/meshbench-linux-x86_64.tar.gz >/dev/null || { echo "::error::no Linux tarball"; exit 1; }
          # And the project still has to have a licence to be given away.
          go run ./tools/licgen -require-project-licence

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF_NAME}" in
              v*) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)  echo "::error::set a version to release"; exit 1 ;;
            esac
          fi
          TAG="v${VERSION}"

          # GPL-3.0 section 6: whoever gets the binary can have the source.
          git archive --format=tar.gz --prefix="meshbench-${VERSION}/" \
            -o "dist/meshbench-${VERSION}-source.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

          {
            echo "## Installing"
            echo
            echo "See the [quick start](https://github.com/MeshBench/meshbench#install-and-run) for each platform."
            echo
            echo "| platform | download | notes |"
            echo "|---|---|---|"
            ls dist/*.AppImage >/dev/null 2>&1 && echo "| Linux | \`.AppImage\` | one file, any distribution |"
            ls dist/*.deb >/dev/null 2>&1 && echo "| Debian, Ubuntu | \`.deb\` | \`sudo apt install ./meshbench_*.deb\` |"
            ls dist/meshbench-linux-x86_64.tar.gz >/dev/null 2>&1 && echo "| Linux | \`.tar.gz\` | includes the QEMU and Renode emulators |"
            ls dist/*.dmg >/dev/null 2>&1 && echo "| macOS (Apple Silicon) | \`.dmg\` | **unsigned** - right-click Open, see the README |" || echo "| macOS | - | did not build for this release |"
            ls dist/*.zip >/dev/null 2>&1 && echo "| Windows | \`.zip\` | unzip and run \`meshbench.exe\`; SmartScreen will warn |" || echo "| Windows | - | did not build for this release |"
            echo
            echo "Neither the macOS nor the Windows build is code-signed yet, so both"
            echo "operating systems will object the first time. The README says exactly"
            echo "what they say and how to proceed."
            echo
            echo "\`SHA256SUMS\` covers every file here. The source archive is included"
            echo "because MeshBench is GPL-3.0-or-later and the repository is private."
          } > /tmp/notes.md

          gh release create "$TAG" dist/* --target "${GITHUB_SHA}" \
            --title "MeshBench $VERSION" --notes-file /tmp/notes.md \
            || gh release upload "$TAG" dist/* --clobber
