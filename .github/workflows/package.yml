name: package

# A bundle somebody can download and run, with the emulators inside it.
#
# Linux only for now, deliberately. macOS and Windows are visible below and
# skipped, with the reason in the file: an absent row gets forgotten, a skipped
# one with a reason gets picked up.
#
# The plan this implements is docs/release-packaging-plan.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release from this build'
        type: boolean
        default: false

jobs:
  linux:
    # The oldest base that can link. This used to be 24.04 because cimgui-go
    # shipped a prebuilt cimgui.a referencing __isoc23_sscanf, a symbol glibc
    # only grew in 2.38 - a dependency's floor showing through as several
    # hundred undefined references. workbench1 and internal/ui are gone, so
    # nothing links cimgui and the floor is now the runner's own glibc: 2.35,
    # which reaches Ubuntu 22.04, Debian 12 and RHEL 9.
    #
    # Build on the oldest base you intend to support, because glibc symbol
    # versioning is one-way: a binary linked against 2.35 runs on 2.38, and
    # never the other way round.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }

      - name: Dependencies
        run: |
          sudo apt-get update
          # cgo through Gio and wgpu, so this is a native build and not a
          # cross-compile. GL, X11, Wayland, xkbcommon, EGL and Vulkan headers
          # are all needed to link even though the binary can run headless.
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libffi-dev

      - name: Licences are fresh
        # The window shows what the binary links. Regenerate and diff: a new
        # dependency without a licence entry fails here, not in a lawyer's
        # inbox. licgen itself fails on a module whose licence it cannot name.
        run: |
          go run ./tools/licgen
          git diff --exit-code -- internal/workbench/licences/licences.json

      - name: Build and check
        run: |
          set -e
          test -z "$(gofmt -l ./cmd ./internal ./tools)"
          go vet ./...
          # -short: the long tests boot real firmware and measure run-to-run
          # spread, which needs an idle machine - a shared runner fails the
          # noise-floor measurement on load, not on code. The full suite is
          # ci.yml's job; this gate is that the artifact builds and works.
          go test -short ./...
          # One binary, one workbench: `meshbench workbench` is the Gio app,
          # and the imgui one it replaced has been deleted.
          #
          # The app ID is set here rather than left to default. Gio takes the
          # Wayland app_id and the X11 class from it, and the default is the
          # binary's own name - so a taskbar grouping and a window-manager rule
          # would otherwise key on whatever the file happened to be called.
          #
          # Reverse DNS wants a domain the project controls, and MeshBench owns
          # no domain - so it takes the form for a GitHub-hosted project, which
          # is what Flathub asks for too. It follows the org, not a person.
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="dev-$(git rev-parse --short HEAD)";; esac
          go build -trimpath \
            -ldflags "-X gioui.org/app.ID=io.github.meshbench.meshbench \
                      -X github.com/MeshBench/meshbench/internal/workbench.Version=$VERSION" \
            -o dist/meshbench/meshbench ./cmd/meshcoresim

      - name: Fetch the emulators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist/meshbench
          # Both are our forks and neither can be a distribution build: ours
          # carry the SX1262 device and the SEVONPEND fix respectively, and a
          # stock build of either runs, reports no chip or hangs, and looks like
          # our fault. The changes are deliberately not upstreamed, so the
          # forks' own release artifacts carry a meshbench mark in the name -
          # nobody should mistake one for an upstream build. The patterns
          # wildcard around it rather than pinning where in the name it sits.
          #
          # QEMU's archives are .tar.xz and carry the target in the name;
          # only the Xtensa one runs ESP32 firmware, so the riscv32 build in
          # the same release is deliberately not downloaded.
          gh release download --repo MeshBench/qemu --pattern '*xtensa*x86_64-linux-gnu.tar.xz' \
            --dir . --clobber || echo "::warning::no QEMU release yet, bundle ships without it"
          gh release download --repo MeshBench/renode --pattern '*linux*portable*meshbench*.tar.gz' \
            --dir . --clobber || echo "::warning::no Renode release yet, bundle ships without it"
          # -xf rather than -xzf: the two forks package differently and the
          # bundle should not care which. tar reads the compression itself.
          for f in *.tar.gz *.tar.xz; do [ -e "$f" ] || continue; tar xf "$f" && rm "$f"; done
          ls -la

      - name: Fonts and fixtures
        run: |
          set -e
          # Emoji in node names should not depend on the user's font packages;
          # withEmoji() looks in fonts/ beside the binary first. OFL-1.1, and
          # the licence window carries the attribution.
          mkdir -p dist/meshbench/fonts
          curl -fsSL -o dist/meshbench/fonts/NotoColorEmoji.ttf \
            https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf \
            || echo "::warning::emoji font not fetched, bundle falls back to system fonts"
          # The shipped fixtures, so the workbench has something to open on a
          # machine with nothing else on it.
          cp -r fixtures dist/meshbench/fixtures

      - name: Assemble
        run: |
          set -e
          cd dist/meshbench
          # The same inventory the Help > Licences window shows, as files, for
          # the people who read a directory rather than open a window.
          (cd ../.. && go run ./tools/licgen -text dist/meshbench/LICENCES)
          # Beside the binary is where MeshBench looks second, after the
          # environment variable and before its cache. A desktop application is
          # not launched from a shell, so PATH is nearly useless to it.
          # Both emulators unpack into their own directory, and MeshBench
          # looks for an executable *file* beside its own binary - so each
          # needs a symlink or the bundle contains an emulator nobody can
          # find. Renode's directory carries its version, so match on the
          # shape rather than a name that changes with every release.
          for d in qemu qemu-meshbench; do
            [ -d "$d" ] && ln -sf "$d/bin/qemu-system-xtensa" . && break
          done
          for d in renode_*-portable renode-*-portable renode; do
            [ -x "$d/renode" ] && ln -sf "$d/renode" . && break
          done
          ls -la qemu-system-xtensa renode 2>&1 || \
            echo "::warning::an emulator symlink is missing; the bundle has it but MeshBench will not find it"
          cat > README.txt <<'TXT'
          MeshBench

          Run ./meshbench workbench

          Needs a GPU with Vulkan or GL.

          MeshBench is free software under the GNU General Public Licence,
          version 3 or later. The full terms are in LICENCES/, and the source
          for this exact build is the meshbench-*-source.tar.gz published beside
          it on the release page.

          The emulators beside this file are found automatically. They are not
          distribution builds and cannot be: the QEMU carries an SX1262 device
          upstream does not have, and the Renode carries a SEVONPEND fix without
          which published nRF52 firmware sleeps for ever. Their release
          artifacts say meshbench in the name for that reason - these forks are
          built for this simulator and are not upstream releases.

          qemu-system-xtensa is a symlink on purpose. QEMU resolves its own path
          to find its data files, so a bare copy of the binary will not run.

          Native MeshCore builds and board images are downloaded on first use and
          cached under ~/.cache/meshcoresim. Nothing else is needed.

          Needs glibc 2.35 or newer: Ubuntu 22.04, Debian 12, RHEL 9, or
          anything more recent.

          Everything this bundle ships under is in LICENCES/, and in the
          application under Help > Licences & attributions.
          TXT
          cd ..
          # MeshCIM is proprietary and must never appear in an artifact, under
          # any spelling. Cheap insurance against a fixture or doc drifting in.
          if grep -ri meshcim . >/dev/null 2>&1; then
            echo "::error::MeshCIM reference found in the bundle"; exit 1
          fi
          tar czf meshbench-linux-x86_64.tar.gz meshbench
          # GPL-3.0 section 6: whoever receives the binary can have the source
          # that made it. The repository is private for now, so the source
          # travels with the release rather than being a link. When the
          # repository goes public this can become a URL in the notes.
          VERSION="${GITHUB_REF_NAME:-dev}"
          (cd .. && git archive --format=tar.gz \
            --prefix="meshbench-${VERSION}/" -o "dist/meshbench-${VERSION}-source.tar.gz" HEAD)
          sha256sum *.tar.gz > SHA256SUMS
          # The smoke is the artifact, not the tree: unpack what users get and
          # ask it who it is. The graphical smoke stays on a real desktop
          # before tagging, per the plan's acceptance.
          mkdir /tmp/smoke && tar xzf meshbench-linux-x86_64.tar.gz -C /tmp/smoke
          /tmp/smoke/meshbench/meshbench workbench -version
          test -s /tmp/smoke/meshbench/LICENCES/INDEX.txt
          ls -la *.tar.gz SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: meshbench-linux
          # Days, not the default ninety. These bundles are 30-110 MB each and
          # a tagged release keeps its own copy for ever as a release asset -
          # so a long retention here buys nothing and quietly fills the
          # account's Actions storage, which is metered separately from
          # minutes and fails the billing check on its own.
          retention-days: 5
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # An unlicensed project cannot be released to end users:
          # this is the gate that makes the decision unavoidable.
          go run ./tools/licgen -require-project-licence
          TAG="${GITHUB_REF_NAME:-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)}"
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --generate-notes || \
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber

  macos:
    if: false   # waiting on a self-hosted Mac runner, deliberately: hosted
                # macOS minutes bill at 10x on a private repository. Also
                # still missing underneath - the QEMU fork does not build for
                # Apple Silicon, and meshcore-native publishes no darwin-arm64
                # host builds. See docs/distribution-plan.md.
    runs-on: macos-14
    steps: [{ run: 'echo see docs/release-packaging-plan.md' }]

  windows:
    if: false   # no runner yet: radioserver's QEMU path uses Unix sockets. The
                # TCP path it already has for Renode is what this needs first.
    runs-on: windows-latest
    steps: [{ run: 'echo see docs/release-packaging-plan.md' }]
