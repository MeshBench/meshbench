name: diag-windows-bundle

# Why an MSI-installed binary behaves differently from the same binary out of
# the zip. A diagnostic on a branch trigger, not a gate.

on:
  push:
    branches: ['diag/windows-bundle']

permissions: {}

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - name: Fetch both artefacts
        shell: pwsh
        run: |
          gh release download v0.0.5 --repo MeshBench/meshbench `
            --pattern "*windows-x86_64.msi" --pattern "*windows-x86_64.zip"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install the MSI and unpack the zip
        shell: pwsh
        run: |
          $msi = (Get-ChildItem *.msi)[0].FullName
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn" -Wait
          Expand-Archive -Path (Get-ChildItem *.zip)[0].FullName -DestinationPath unzipped -Force

      - name: Are the two binaries the same file
        shell: pwsh
        run: |
          $m = "$env:ProgramFiles\MeshBench\meshbench.exe"
          $z = (Get-ChildItem unzipped -Recurse -Filter meshbench.exe | Select-Object -First 1).FullName
          "msi: $m"
          if (Test-Path $m) { Get-FileHash $m -Algorithm SHA256 | Format-List Hash,Path; (Get-Item $m).Length }
          "zip: $z"
          Get-FileHash $z -Algorithm SHA256 | Format-List Hash,Path; (Get-Item $z).Length

      - name: What each carries beside it
        shell: pwsh
        run: |
          $md = "$env:ProgramFiles\MeshBench"
          $zd = Split-Path (Get-ChildItem unzipped -Recurse -Filter meshbench.exe | Select-Object -First 1).FullName
          "--- msi top level ---"; Get-ChildItem $md | Select-Object -ExpandProperty Name
          "--- zip top level ---"; Get-ChildItem $zd | Select-Object -ExpandProperty Name
          "msi dll count: " + (Get-ChildItem $md -Filter *.dll).Count
          "zip dll count: " + (Get-ChildItem $zd -Filter *.dll).Count

      - name: The Start menu shortcut, and what working directory it sets
        shell: pwsh
        continue-on-error: true
        run: |
          $sh = New-Object -ComObject WScript.Shell
          Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu" -Recurse -Filter "*MeshBench*.lnk" |
            ForEach-Object {
              $l = $sh.CreateShortcut($_.FullName)
              "shortcut : $($_.Name)"
              "target   : $($l.TargetPath)"
              "workdir  : [$($l.WorkingDirectory)]"
            }

      - name: Does it survive being started from somewhere else
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "$env:ProgramFiles\MeshBench\meshbench.exe"
          foreach ($wd in @("$env:ProgramFiles\MeshBench", "$env:SystemRoot\System32", "$env:USERPROFILE")) {
            $o = "o.txt"; $e = "e.txt"
            $p = Start-Process $exe -ArgumentList "-version" -Wait -PassThru -WorkingDirectory $wd `
                   -RedirectStandardOutput $o -RedirectStandardError $e -NoNewWindow
            "cwd=$wd  exit=$($p.ExitCode)  out=[" + ((Get-Content $o -EA SilentlyContinue) -join '') + "]  err=[" + ((Get-Content $e -EA SilentlyContinue) -join '') + "]"
          }

      - name: Headless from a foreign working directory, the shortcut case
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "$env:ProgramFiles\MeshBench\meshbench.exe"
          $p = Start-Process $exe -ArgumentList "headless","-fixture","fife-strict" -PassThru `
                 -WorkingDirectory "$env:SystemRoot\System32" `
                 -RedirectStandardOutput hs.txt -RedirectStandardError he.txt -NoNewWindow
          Start-Sleep -Seconds 25
          if (-not $p.HasExited) { "still running, which is the good case"; $p.Kill() } else { "exited with $($p.ExitCode)" }
          "--- stdout ---"; Get-Content hs.txt -EA SilentlyContinue | Select-Object -First 20
          "--- stderr ---"; Get-Content he.txt -EA SilentlyContinue | Select-Object -First 20
