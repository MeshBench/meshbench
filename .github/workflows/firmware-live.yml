name: Firmware live

# The tests that need a real MeshCore process, which nothing has ever run.
#
# Thirty-two tests skip without MESHBENCH_LIVE, six more without
# MESHBENCH_BOARD, and none of those three names appeared anywhere in this
# directory. Five of the seven tests beside the native backend resolve a
# MeshCore build and skip when there is none, and no job ever fetched one - so
# TestNativeAirtimeAgreesWithTheChannel, which checks a rule CLAUDE.md states
# about itself ("airtime must match the firmware's own getEstAirtimeFor()"),
# had never run in the pipeline at all. A firmware drift there desynchronises
# the mesh from the channel silently, which is exactly the failure a nightly
# is for.
#
# Not on every push. It starts real processes and takes tens of minutes, and
# CI's own file makes the argument: a check nobody waits for is a check that
# gets worked around. Nightly, on request, or on a pull request labelled
# firmware-live when a change is expected to move any of this.

on:
  schedule:
    # Small hours, and not on the hour: the lab runners are shared, and every
    # cron in the world fires at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      board:
        description: >-
          An emulated board to probe as well, e.g. Generic_E22_sx1262. Needs a
          runner with the QEMU or Renode toolchain: docs/development-machines.md
          records that the lab runners have none, so this is for a machine that
          does. Left empty, the board probe is skipped rather than left to fail
          slowly.
        required: false
        default: ""
      board_version:
        description: "Firmware version for that board, e.g. v1.17.1"
        required: false
        default: "v1.17.1"
  pull_request:
    # "labeled" is GitHub's spelling of the event, not this project's spelling
    # of the word.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# One live run at a time, and never cancelled part way.
#
# docs/development-machines.md is explicit that emulated boards run one at a
# time, because several at once take a twelve-core machine down - and a live
# run also holds one of three shared runners for the whole of its length.
# cancel-in-progress stays false so a nightly that is already booting a board
# is not interrupted by somebody's dispatch.
concurrency:
  group: firmware-live
  cancel-in-progress: false

jobs:
  live:
    # On a pull request only when it is asked for by name. The label is the
    # whole trigger: this is far too slow to sit in front of a merge.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'firmware-live')
    # 60 was the gated suite alone, whose own -timeout is 50m. The fixture
    # sweep after it is another ten on a warm machine and more on a cold one,
    # and a job cut off by its own budget names nothing, which is the least
    # useful way for a nightly to fail.
    timeout-minutes: 90
    # The same fork guard ci.yml computes rather than hardcodes: the lab
    # runners sit on a home LAN with a NAS mounted, so a stranger's code must
    # never land on one. Forks fall back to hosted runners, where everything
    # here still works - the MeshCore builds are downloaded from a public
    # release, and no board is probed without the dispatch input.
    #
    # lab-2404, not lab-linux, and this job is the one place that matters.
    # MeshCore's published native builds need glibc 2.38; gha-lab-3 is the
    # 22.04 runner that pins package.yml's own floor at 2.35, and it carries
    # lab-linux too. So a nightly landed on whichever runner was free and died
    # in two seconds on one of the three with a linker error naming a symbol
    # version, which reads as a broken download rather than as the wrong
    # machine. The floor this job needs is the firmware's, not ours.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","lab-2404"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # cache: false, as in ci.yml - a persistent self-hosted runner
          # already has a warm GOMODCACHE, and uploading it over the lab's
          # uplink has stalled a run before.
          cache: false

      # cgo, through Gio. The session and cmd packages compile the UI, so the
      # headers are needed even though nothing opens a window.
      - name: Headers cgo needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libffi-dev

      # MeshCore, built for this host, from the public release the simulator
      # downloads at runtime anyway (ADR-0020: those binaries link MeshCore and
      # are published under its MIT licence, from a repository of their own).
      #
      # Fetched here rather than left to the tests so that a release that has
      # moved fails on this step, saying so, instead of turning every live test
      # into a skip that reads like a pass. One directory holding one build per
      # role, which is what MESHBENCH_NATIVE wants: pointing it at a single
      # binary would override every node regardless of role.
      - name: The MeshCore builds the live tests run
        env:
          NATIVE_TAGS: repeater-v1.17.1 companion-v1.17.1 room-server-v1.17.1
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/native"
          mkdir -p "$dir"
          base=https://github.com/MeshBench/meshcore-native/releases/download
          for tag in $NATIVE_TAGS; do
            case "$tag" in
              repeater-*)    role=simple_repeater ;;
              companion-*)   role=companion_radio ;;
              room-server-*) role=simple_room_server ;;
              # Rather than carrying the previous iteration's role forward and
              # downloading the same binary twice under two names.
              *) echo "no role known for tag $tag"; exit 1 ;;
            esac
            name="meshcore-$role-linux-amd64"
            curl -fsSL -o "$dir/$name" "$base/$tag/$name"
            chmod +x "$dir/$name"
          done
          ls -l "$dir"
          # What this machine can link against, said before the binary is run.
          # A published build too new for the runner fails as "version
          # GLIBC_2.38 not found", which names a symbol version and not the
          # reason, and reads as a broken download of a file that arrived
          # perfectly.
          # Both reads are allowed to come back empty, and pipefail is on: a
          # statically linked build has no GLIBC_ symbols to find, and an ldd
          # that words its first line differently gives no version. Neither is
          # a reason to fail a job over, so the check is skipped rather than
          # the step dying on a grep that matched nothing.
          need=$(objdump -T "$dir/meshcore-simple_repeater-linux-amd64" 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
          have=$(ldd --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+$' || true)
          if [ -z "$need" ] || [ -z "$have" ]; then
            echo "no glibc floor to compare (need='$need' have='$have'); skipping the check"
          elif [ "$(printf '%s\n%s\n' "$need" "GLIBC_$have" | sort -V | tail -1)" != "GLIBC_$have" ]; then
            echo "::error::MeshCore's published builds need $need and this runner"\
                 "has GLIBC_$have. This job asks for lab-2404 for that reason; a"\
                 "runner below the floor cannot start a native node at all."
            exit 1
          else
            echo "firmware needs at most $need; this runner provides GLIBC_$have"
          fi
          # The airtime it reports for a 40-byte packet at the defaults, which
          # is the one number a broken or truncated download gets wrong loudly.
          "$dir/meshcore-simple_repeater-linux-amd64" --print-airtime 40
          echo "MESHBENCH_NATIVE=$dir" >> "$GITHUB_ENV"

      - name: The gated suite
        env:
          MESHBENCH_LIVE: "1"
          MESHBENCH_BOARD: ${{ inputs.board }}
          MESHBENCH_BOARD_VERSION: ${{ inputs.board_version }}
        run: |
          set -euo pipefail
          # A node keeps its identity and its preferences between runs, which
          # is how hardware behaves and a trap for a comparison: saved
          # preferences beat a compiled default. A directory per run gives
          # every node one that has never booted.
          export MESHBENCH_NODEFS="$RUNNER_TEMP/nodefs"
          # The packages a native build alone is enough for. internal/sim/engine
          # is not among them: half its live tests boot a published board image
          # under QEMU beside radioserver, and on a machine without those they
          # fail rather than skip, saying the tool is missing. Running them here
          # would be a red job every night reporting a runner's toolchain, not a
          # regression. They join in when a board is named, which is the moment
          # somebody has a machine that can.
          pkgs="./cmd/meshbench/... ./internal/firmware/... ./internal/sim/boardcheck/... ./internal/app/session/..."
          skip=""
          if [ -n "${MESHBENCH_BOARD}" ]; then
            pkgs="$pkgs ./internal/sim/engine/..."
          else
            # TestProbeOneBoard defaults to a board rather than skipping, so
            # without an emulator it downloads an image, fails to boot it and
            # reports nothing, for twenty minutes.
            skip="-skip TestProbeOneBoard"
          fi
          # -p 1: one package at a time. Every one of these starts real
          # processes, and the emulated ones must run one at a time or they
          # take the machine down - docs/development-machines.md, learned by
          # taking one down.
          go test -count=1 -timeout 50m -p 1 $skip $pkgs

      # Every shipped fixture, against its own assertions, uncapped.
      #
      # ci.yml runs these on every push but only for the two Fife fixtures: the
      # Scotland and Scotland-Ireland ones are 161 and 376 MeshCore processes
      # and minutes of wall clock apiece, which is too much to hold a merge
      # behind and exactly what a nightly is for.
      #
      # And here it answers a second question, because MESHBENCH_NATIVE is
      # still set from the step above: these runs use the builds this job
      # downloaded rather than the versions the fixtures pin, so a firmware
      # release that quietly stops delivering shows up as a fixture that no
      # longer does what its author said it did. That is the drift this whole
      # workflow exists to catch, asked of a whole mesh rather than of a unit.
      - name: Every fixture, uncapped, on the firmware this job fetched
        env:
          # A node keeps its identity and preferences between runs, and a
          # fixture that passes on what the last run left behind has not
          # passed. Its own directory, never booted.
          MESHBENCH_NODEFS: ${{ runner.temp }}/fixture-nodefs
        run: |
          go build -o "$RUNNER_TEMP/meshbench" ./cmd/meshbench
          MESHBENCH="$RUNNER_TEMP/meshbench" tools/fixture-check.sh

  # A scheduled run goes red on a page nobody opens.
  #
  # Four of the seven shipped fixtures are checked here and nowhere else, so
  # this workflow is the only thing standing behind them. A scheduled job that
  # has gone red and stayed red is a failure this repository has had before, and
  # it stayed for as long as it did because nothing carried the news anywhere a
  # person looks. An issue is that place, and it is what a red run has to leave
  # behind if running it is to be worth anything.
  #
  # One open issue rather than one a night: a fortnight of red is a thread with
  # fourteen links in it, not fourteen duplicates somebody has to close.
  notify:
    needs: live
    # The scheduled run only. A dispatch or a labelled pull request has somebody
    # already watching the run they asked for, and filing at them is noise.
    if: always() && github.event_name == 'schedule' && needs.live.result == 'failure'
    runs-on: ubuntu-latest
    # Job-level permissions replace the file's, so contents is restated rather
    # than inherited.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Say it where somebody will see it
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh is told which repository it is in.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly firmware-live is failing
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Red again: $RUN_URL"
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$(cat <<EOF
          The nightly live-firmware run failed: $RUN_URL

          It runs the tests that need a real MeshCore process, and every shipped
          fixture against its own assertions with no node cap. Nothing else runs
          the four national fixtures, so a failure here can be the only report
          that a mesh has stopped delivering.

          This issue is reused by later failures rather than duplicated. Close it
          when the nightly is green again.
          EOF
          )"
