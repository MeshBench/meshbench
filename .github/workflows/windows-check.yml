name: windows-check

# Does MeshBench actually work on Windows, beyond compiling?
#
# The GPU kernels are proven on Metal (a real Mac) and on Vulkan (Linux), and
# have never once been run on DX12 - which is the backend every Windows user
# would get. A kernel that is wrong there fails as a silently slow or silently
# empty link warm, which is exactly the kind of bug that reaches a user.
#
# Manual for the GPU work, because DX12 only needs re-proving when something
# touches the kernels, and a check nobody waits for should not sit in front of
# every merge. The 2x Windows multiplier was the other half of that argument
# while the repository was private; it is public now and hosted minutes are
# free, so the first half is the whole of it.
#
# It used to run on a release tag as well, and that was worth having when it was
# the only thing compiling for Windows: on 21 August the build had been broken
# for a week and nothing knew, because internal/app/session used unix.Access and
# nothing else looked.
#
# That half is covered now. package.yml cross-compiles the Windows binary on the
# same v* tag - GOOS=windows with mingw, on a lab runner - so a release that
# cannot build for Windows still fails, and fails for nothing. What this
# workflow uniquely buys is the part a cross-compile cannot: the kernels running
# on DX12 on a real Windows machine.
#
# So it is dispatched, and the trade is stated rather than assumed. A release
# is proven to *build* for Windows automatically and proven to *run* only when
# somebody asks. This is a hosted Windows runner at a 2x multiplier on a free
# account, and the minutes are better spent on the checks that gate a merge.
on:
  workflow_dispatch:

jobs:
  check:
    # This job only smoke-checks a cross-compiled binary, so thirty minutes is
    # already generous. The GitHub default is six hours, and a hung run sitting
    # in the queue for that long is the failure worth guarding against: it used
    # to be a bill as well, which the public repository has taken away.
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      # The job must test the Go that go.mod asks for, not a version that
      # happens to be installed with a silent download papering over the gap.
      # Under the default GOTOOLCHAIN=auto this job pinned 1.24, fetched
      # 1.25.x behind the scenes and reported a pass for a toolchain it never
      # named - so the one thing that compiles for Windows was also the one
      # thing whose declared version meant nothing. local makes the pin below
      # the whole answer: wrong, and the job says so on the first go command.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.25', cache: true }

      - name: What GPU the runner offers
        shell: bash
        run: |
          # A hosted runner has no real GPU; wgpu falls back to WARP, DX12's
          # software rasteriser. That still exercises the shader translation
          # and the buffer bindings, which is where a backend goes wrong -
          # only the timings are meaningless.
          powershell -Command "Get-CimInstance Win32_VideoController | Select-Object -Property Name,DriverVersion | Format-List" || true

      - name: The GPU kernels against their CPU twins
        shell: bash
        # No tail: the failing test is the one that gets cut off, every time.
        continue-on-error: true
        run: go test ./internal/rf/gpu/ -count=1 -v -timeout 15m

      - name: The platform layer
        shell: bash
        continue-on-error: true
        run: go test ./cmd/meshbench/ ./internal/firmware/ ./internal/mesh/companion/ ./internal/sim/engine/ -short -count=1 2>&1 | tail -20

      # The cheapest question there is, and one that went a week unasked:
      # does the tree compile for Windows at all. It could not until
      # tools/goldencap grew a build constraint - its serial port is termios
      # and therefore Linux - so this would have failed on a tool nobody runs
      # here while saying nothing about the application. Not
      # continue-on-error: a tree that does not compile is the failure this
      # job exists for.
      - name: Does the whole tree compile
        shell: bash
        run: go build ./...

      - name: Does it open its own network with no fixtures beside it
        shell: bash
        run: |
          go build -o meshbench.exe ./cmd/meshbench
          mkdir -p /tmp/elsewhere && cp meshbench.exe /tmp/elsewhere/
          cd /tmp/elsewhere
          # From a directory with no fixtures beside it: can the application
          # still find its own example network. This asked "check" until now,
          # which stopped being a command when it was renamed to "test" - and
          # "|| echo" swallowed the refusal, so the one behavioural question
          # in this job answered nothing for as long as that took.
          #
          # Still running when the timeout fires is the pass, so the exit
          # code is read the other way round: 124 is what we want and a clean
          # exit means it gave up on its own. Headless rather than test, so
          # this stays a question about finding the fixture rather than a
          # firmware download and fifty-six processes.
          set +e
          timeout 25 ./meshbench.exe headless -fixture fife-strict
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "::error::headless -fixture fife-strict exited $rc from a foreign"
            echo "::error::working directory; it should still be running at 25s"
            exit 1
          fi
          echo "still up at 25s, which is the good case"
          ./meshbench.exe workbench -version
