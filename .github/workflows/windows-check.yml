name: windows-check

# Does MeshBench actually work on Windows, beyond compiling?
#
# The GPU kernels are proven on Metal (a real Mac) and on Vulkan (Linux), and
# have never once been run on DX12 - which is the backend every Windows user
# would get. A kernel that is wrong there fails as a silently slow or silently
# empty link warm, which is exactly the kind of bug that reaches a user.
#
# Manual for the GPU work, because DX12 only needs re-proving when something
# touches the kernels, and a check nobody waits for should not sit in front of
# every merge. The 2x Windows multiplier was the other half of that argument
# while the repository was private; it is public now and hosted minutes are
# free, so the first half is the whole of it.
#
# But also on a release tag, and for one narrow reason: on 21 August the Windows
# build had been broken for a week and nothing knew. internal/app/session used
# unix.Access, which does not exist there, and the only thing that compiles for
# Windows is this file - last dispatched seven days earlier. A check that runs
# when somebody remembers did not remember.
#
# The tag is the cheapest moment that is not "never": one run per release rather
# than one per push, and a release that cannot build for Windows should not be
# published anyway.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    # A hosted Windows runner is minutes we pay for, and this job only smoke-
    # checks a cross-compiled binary. Six hours of a hung one is not a bill
    # worth risking.
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      # The job must test the Go that go.mod asks for, not a version that
      # happens to be installed with a silent download papering over the gap.
      # Under the default GOTOOLCHAIN=auto this job pinned 1.24, fetched
      # 1.25.x behind the scenes and reported a pass for a toolchain it never
      # named - so the one thing that compiles for Windows was also the one
      # thing whose declared version meant nothing. local makes the pin below
      # the whole answer: wrong, and the job says so on the first go command.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.25', cache: true }

      - name: What GPU the runner offers
        shell: bash
        run: |
          # A hosted runner has no real GPU; wgpu falls back to WARP, DX12's
          # software rasteriser. That still exercises the shader translation
          # and the buffer bindings, which is where a backend goes wrong -
          # only the timings are meaningless.
          powershell -Command "Get-CimInstance Win32_VideoController | Select-Object -Property Name,DriverVersion | Format-List" || true

      - name: The GPU kernels against their CPU twins
        shell: bash
        # No tail: the failing test is the one that gets cut off, every time.
        continue-on-error: true
        run: go test ./internal/rf/gpu/ -count=1 -v -timeout 15m

      - name: The platform layer
        shell: bash
        continue-on-error: true
        run: go test ./internal/firmware/ ./internal/mesh/companion/ ./internal/sim/engine/ -short -count=1 2>&1 | tail -20

      - name: Does it open its own network with no fixtures beside it
        shell: bash
        continue-on-error: true
        run: |
          set -e
          go build -o meshbench.exe ./cmd/meshbench
          mkdir -p /tmp/elsewhere && cp meshbench.exe /tmp/elsewhere/
          cd /tmp/elsewhere
          # The question bug 1 asks, on Windows: run from a directory with no
          # fixtures in it and see whether the application can still find its
          # own example network.
          ./meshbench.exe check 2>&1 | tail -5 || echo "check needs a fixture - which is the bug"
          ./meshbench.exe workbench -version
