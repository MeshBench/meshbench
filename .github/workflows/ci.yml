name: CI

on:
  push:
    branches: [main]
    # Tags as well as main, so that pushing a release tag runs the full set
    # including the race detector - see the race job below.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # v2.1.6 cannot lint a go1.25.0 module at all - "the Go language version used
  # to build golangci-lint is lower than the targeted Go version". Beyond that,
  # versions disagree about this tree: v2.1.6 and v2.12.2 differ by 29
  # findings, so .golangci-baseline.txt is only meaningful against the version
  # named here. Contributors need this one too; CONTRIBUTING.md says so.
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  check:
    # 20 minutes is roughly forty times what this job takes. The point of the
    # number is not to be tight - it is that the GitHub default is six hours,
    # and a wedged job holds one of three lab runners for all of it.
    timeout-minutes: 20
    # The lab runners sit on a home LAN with a NAS mounted, so a fork's PR -
    # a stranger's code - must never land on one. Forks fall back to hosted
    # runners here rather than being skipped, so a fork PR still gets checked.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","lab-linux"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod says go 1.25.0. A lower setup-go here still builds - go
          # auto-downloads the toolchain go.mod asks for - but golangci-lint's
          # own binary does not: v2.1.6 is built with go1.24 and refuses to
          # load a config targeting a Go version higher than itself. Matching
          # the two removes that gap rather than working around it once.
          go-version: "1.25"
          # cache: false - this runs on a persistent self-hosted runner whose
          # GOMODCACHE and GOCACHE already survive between jobs, so the cache
          # action only uploads ~260 MB to GitHub over the lab's uplink at
          # under 1 MB/s to rebuild what is already on disk. It stalled a run.
          # Forks fall back to hosted runners and lose the cache; rare, and
          # cheap next to the stall.
          cache: false

      # cgo, through cimgui-go. Every step below that compiles a package -
      # vet, lint, test - compiles the UI package too, and without these it
      # stops at "GL/gl.h: No such file or directory". The binary still runs
      # headless; it is the *build* that needs the headers.
      - name: Headers cgo needs
        run: |
          sudo apt-get update
          # Gio links against Wayland, xkbcommon, EGL and Vulkan as well as
          # GL and X11 - vet and test both compile the GUI packages, so the
          # headers are needed here even though nothing opens a window.
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libffi-dev

      # Learned on hamreach: a botched merge once staged conflict markers into
      # a source file and 42 of 52 tests went red for that one reason.
      - name: no conflict markers
        run: |
          if grep -rnE '^(<{7}|={7}|>{7})( |$)' \
               --include='*.go' --include='*.wgsl' --include='*.lua' \
               --include='*.yml' --include='*.md' . | grep -v '/vendor/'; then
            echo "conflict markers committed"; exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The licence inventory is generated, embedded in the workbench and
      # shipped in every bundle - and until now licgen ran only on a tag
      # push. The seven-layer move renamed internal/workbench and licgen's
      # hardcoded destination did not follow, so the release pipeline was
      # broken for two days with nothing to notice. Running it here means a
      # rename that breaks it fails the PR that does the renaming.
      - name: Licence inventory is generatable, and fresh
        run: |
          go run ./tools/licgen
          git diff --exit-code -- internal/ui/workbench/licences/licences.json

      # The boards, radio presets and node kinds both clients offer, generated
      # from internal/world/scenario. A hand-copied list is a list that is
      # wrong the week somebody adds a board - and a constant that compiles and
      # names a board the simulator has never heard of is worse than a string,
      # because it looks checked.
      - name: Client enums are generatable, and fresh
        run: |
          go run ./tools/clientgen
          git diff --exit-code -- clients/go/meshbench/sets_gen.go clients/python/meshbench/sets.py

      # The scripting API's verb table is generated
      # The linter set went from 8 to 20 and returned 96 findings, so the run
      # can no longer simply demand zero. It demands that the count has not
      # risen: tools/lint-ratchet.sh compares per-linter counts against
      # .golangci-baseline.txt, fails on any increase, and reports any decrease
      # so the baseline gets tightened by the change that earned it.
      #
      # Installed directly rather than through golangci-lint-action, because
      # the action's whole job is to run the linter and fail on findings, and
      # here the ratchet decides that. One version, named once, in env above.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION
          # setup-go puts GOPATH/bin on PATH, but say so explicitly rather
          # than depending on it: a self-hosted runner with a warm GOPATH has
          # been surprising before.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/golangci-lint" --version

      - name: lint ratchet
        run: tools/lint-ratchet.sh

      # The 500-line hard limit from CLAUDE.md. Applied to shaders and the
      # dissector too, not just Go: hamreach enforced Go only and its largest
      # file reached 746 lines before anyone noticed.
      #
      # A file carrying lint:file-length-exempt passes and says why in its own
      # header. There is one, the Wireshark dissector, because Wireshark loads
      # a dissector as a single plugin file. Everything else is under the
      # limit and stays under it.
      - name: file length
        run: |
          fail=0
          while IFS= read -r f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 500 ] && ! grep -q "lint:file-length-exempt" "$f"; then
              echo "$f is $n lines (limit 500, no exemption)"; fail=1
            fi
          done < <(find . \( -name '*.go' -o -name '*.wgsl' -o -name '*.lua' \) -not -path './vendor/*')
          exit $fail

      # "Build artifacts: never tracked", from CLAUDE.md's limits table. A
      # committed engine.test binary had to be removed by hand once; .gitignore
      # covers it now, but .gitignore only stops the accident it anticipated.
      - name: no tracked build artifacts
        run: |
          # .pyc and __pycache__ are on this list because they got committed
          # once: an amend with `git add -A` picked up what a test run had left
          # beside the Python client, and nothing here noticed because the
          # pattern was written before there was any Python to catch.
          if git ls-files | grep -nE '\.(test|exe|out|o|a|so|dylib|AppImage|deb|dmg|pyc|pyo)$|(^|/)__pycache__/|\.egg-info/|^(meshcoresim|workbench2|envgen|goldencap)$'; then
            echo "a build artifact is tracked; git remembers, so it does not need to be committed"
            exit 1
          fi

  # The suite, split across runners.
  #
  # It used to be one step at the end of `check`, which meant the whole run
  # was as long as the slowest package plus everything before it, and a
  # gofmt complaint waited behind ten minutes of RF tests to be told.
  #
  # Three packages carry almost all of the time - session is two statistical
  # tests, workbench is the control audit rendering frames, dsp is the
  # sensitivity and ceiling checks - and `go test` only runs as many packages
  # at once as the runner has cores, which is two. Giving each of the three a
  # runner of its own makes the wall clock the slowest single package rather
  # than the sum.
  #
  # No -race here. It multiplies an already slow suite by enough to make the
  # wait the thing people notice about the pipeline, and a check nobody waits
  # for is a check that gets bypassed. The detector still runs, on main, after
  # the merge - see the race job below.
  test:
    timeout-minutes: 30
    # The lab runners sit on a home LAN with a NAS mounted, so a fork's PR -
    # a stranger's code - must never land on one. Forks fall back to hosted
    # runners here rather than being skipped, so a fork PR still gets checked.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","lab-linux"]') || fromJSON('["ubuntu-latest"]') }}
    strategy:
      # One shard failing should not hide the others - a red session shard
      # and a red dsp shard are usually two different problems.
      fail-fast: false
      matrix:
        include:
          - name: session
            packages: ./internal/app/session/...
          - name: workbench
            packages: ./internal/ui/workbench/...
          - name: dsp
            packages: ./internal/rf/dsp/...
          - name: rest
            packages: ""
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # cache: false - this runs on a persistent self-hosted runner whose
          # GOMODCACHE and GOCACHE already survive between jobs, so the cache
          # action only uploads ~260 MB to GitHub over the lab's uplink at
          # under 1 MB/s to rebuild what is already on disk. It stalled a run.
          # Forks fall back to hosted runners and lose the cache; rare, and
          # cheap next to the stall.
          cache: false

      - name: Headers cgo needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libffi-dev

      # CI has no GPU (and neither does the dev VM), so this exercises the CPU
      # reference path only — which is exactly why ADR-0004 requires one.
      #
      # The "rest" shard is everything the named shards did not take, worked
      # out here rather than listed, so a new package joins it automatically
      # instead of silently going untested.
      - name: test
        run: |
          if [ -n "${{ matrix.packages }}" ]; then
            pkgs="${{ matrix.packages }}"
          else
            pkgs=$(go list ./... | grep -vE '/internal/(app/session|ui/workbench|rf/dsp)(/|$)')
          fi
          echo "$pkgs" | tr ' ' '\n'
          go test -count=1 -timeout 20m $pkgs

  # The Python client, against a real workbench.
  #
  # Its own job because it needs Python and a built binary and neither of the
  # Go shards do, and because a client that is only checked by hand is a client
  # that is wrong by the next release. It starts headless processes, drives
  # them over sockets of its own and stops them - no display anywhere.
  python-client:
    timeout-minutes: 20
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","lab-linux"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Built once and handed to the tests, rather than left for each of them
      # to build: the suite starts a process per test and `go build` is not
      # what is being tested.
      - name: Build the workbench
        run: go build -o /tmp/meshcoresim ./cmd/meshcoresim

      - name: Install the client
        run: pip install -e "clients/python[test]" ruff

      # The lint the package declares for itself, so its own rules are the ones
      # enforced rather than whatever the runner happens to have.
      - name: ruff
        run: |
          ruff check clients/python
          ruff format --check clients/python

      - name: pytest
        env:
          MESHBENCH_BINARY: /tmp/meshcoresim
        run: pytest clients/python/tests -q

  # The race detector, on request.
  #
  # It has earned its keep here - a GPU-probe race crashed every startup, and
  # nothing but the detector was going to find that - but it multiplies an
  # already slow suite by enough that running it on every push made the
  # pipeline the thing people noticed, and a check nobody waits for is a check
  # that gets worked around. Runner minutes are finite and this one is the
  # most expensive thing in the file, so it costs nothing until it is asked
  # for: run it from the Actions tab before a release, or locally with
  # `go test -race ./...` while chasing something.
  race:
    # On a release tag, and on request. The reasoning above still holds - it
    # is far too slow to sit in front of a merge, and three runners in the
    # pool means an hour of detector on every push would starve the checks
    # people are actually waiting for.
    #
    # But "run it from the Actions tab before a release" is a step somebody
    # has to remember, and the argument this file makes throughout is that a
    # check should not depend on that. Pushing the tag is the moment it
    # matters, and the moment nobody is waiting on the answer.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    # No fork fallback needed: schedule and dispatch both run on this repo,
    # and dispatch requires write access to it.
    runs-on: [self-hosted, linux, x64, lab-linux]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # cache: false - this runs on a persistent self-hosted runner whose
          # GOMODCACHE and GOCACHE already survive between jobs, so the cache
          # action only uploads ~260 MB to GitHub over the lab's uplink at
          # under 1 MB/s to rebuild what is already on disk. It stalled a run.
          # Forks fall back to hosted runners and lose the cache; rare, and
          # cheap next to the stall.
          cache: false

      - name: Headers cgo needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libffi-dev

      # -timeout, because the default is ten minutes per package and the
      # workbench's own package spends most of that rendering frames for the
      # control audit. It takes ~85s on a developer machine and blows the
      # default on a two-core runner under -race, which reads as a hang and
      # is a budget.
      - name: test -race
        run: go test -race -count=1 -timeout 30m ./...
