[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshbench"
dynamic = ["version"]
description = "Drive a MeshBench workbench: RF-accurate MeshCore simulation, from Python"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "MeshBench" }]
keywords = ["meshcore", "lora", "mesh", "rf", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
  "Topic :: Scientific/Engineering",
]
# No dependencies, deliberately. The protocol is one JSON object per line over
# a unix socket, and a client that needed a framework for that would be one
# nobody could debug - and one more thing to pin in somebody else's CI.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/MeshBench/meshbench"
Issues = "https://github.com/MeshBench/meshbench/issues"

# Registered as an entry point so `pip install meshbench` is all a firmware
# developer needs: no conftest to copy, which is the step people forget and
# then debug.
[project.entry-points.pytest11]
meshbench = "meshbench.pytest_plugin"

[tool.hatch.version]
path = "meshbench/__init__.py"

[tool.hatch.build.targets.wheel]
# The repo-root .gitignore has "/meshbench" for the built Go binary; without
# this, hatchling's VCS file selection reads it and excludes this package,
# shipping an empty wheel. Name the package explicitly and do not defer to the
# ignore file for what belongs in it.
packages = ["meshbench"]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
# The same collision, and guarding the wheel alone did not cover it: `python -m
# build` builds the sdist first and then builds the wheel *from* the sdist, so
# a package the sdist dropped is a package the wheel cannot contain whatever
# the wheel target says. An sdist is also what pip falls back to where no wheel
# fits, so it has to be complete on its own account.
#
# An allowlist rather than another ignore-vcs, because what belongs in a source
# distribution is a short, knowable list and the failure of getting it wrong is
# silent.
include = ["meshbench", "tests", "examples", "README.md", "pyproject.toml"]
ignore-vcs = true


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
